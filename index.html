(function() {
    'use strict';

    // ============================================================
    //  الإعدادات المتقدمة
    // ============================================================
    const MEMORY_CONFIG = {
        CACHE_KEY: 'soufai_memory_v4',
        BACKUP_KEY: 'soufai_backup_v4',
        MAX_CACHE_ITEMS: 200,
        MAX_CACHE_AGE: 60 * 60 * 1000,
        COMPRESSION_ENABLED: true,
        AUTO_CLEANUP_INTERVAL: 2 * 60 * 1000,
        MAX_STORAGE_SIZE: 10 * 1024 * 1024,
        DEBOUNCE_DELAY: 300,
        VALIDATION_ENABLED: true
    };

    // ============================================================
    //  أدوات مساعدة
    // ============================================================
    const Utils = {
        generateId: () => Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
        
        formatSize: (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },
        
        getTotalStorageSize: () => {
            let total = 0;
            try {
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length * 2;
                    }
                }
            } catch(e) {}
            return total;
        },
        
        getStorageLimit: () => {
            try {
                const test = 'a'.repeat(1024 * 1024 * 10);
                localStorage.setItem('_test_', test);
                localStorage.removeItem('_test_');
                return 10 * 1024 * 1024;
            } catch(e) {
                return 5 * 1024 * 1024;
            }
        },
        
        validateData: (data) => {
            if (data === null || data === undefined) return false;
            if (typeof data === 'string' && data.trim() === '') return false;
            if (Array.isArray(data) && data.length === 0) return false;
            if (typeof data === 'object' && Object.keys(data).length === 0) return false;
            return true;
        },
        
        deepClone: (obj) => {
            if (obj === null || typeof obj !== 'object') return obj;
            if (obj instanceof Date) return new Date(obj);
            if (obj instanceof RegExp) return new RegExp(obj);
            if (Array.isArray(obj)) return obj.map(item => Utils.deepClone(item));
            const cloned = {};
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    cloned[key] = Utils.deepClone(obj[key]);
                }
            }
            return cloned;
        },
        
        getSize: (data) => {
            try {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                return new Blob([str]).size;
            } catch {
                return 0;
            }
        }
    };

    // ============================================================
    //  ضاغط محسن
    // ============================================================
    class AdvancedCompressor {
        static compress(data) {
            if (!MEMORY_CONFIG.COMPRESSION_ENABLED) return data;
            try {
                const json = typeof data === 'string' ? data : JSON.stringify(data);
                return json.replace(/\s+/g, ' ').replace(/\n/g, '');
            } catch {
                return data;
            }
        }

        static decompress(data) {
            try {
                if (typeof data === 'string') {
                    return JSON.parse(data);
                }
                return data;
            } catch {
                return data;
            }
        }
    }

    // ============================================================
    //  نظام التخزين المؤقت المتقدم
    // ============================================================
    class SmartCache {
        constructor() {
            this.data = new Map();
            this.metadata = {
                created: Date.now(),
                hits: 0,
                misses: 0,
                evictions: 0,
                totalSize: 0,
                lastCleanup: Date.now()
            };
            this.pendingWrites = new Map();
            this.isWriting = false;
            this.loadFromStorage();
            this.startAutoCleanup();
            this.setupBeforeUnload();
        }

        setupBeforeUnload() {
            window.addEventListener('beforeunload', () => {
                if (this.pendingWrites.size > 0) this.saveToStorage();
            });
        }

        set(key, value, ttl = MEMORY_CONFIG.MAX_CACHE_AGE) {
            if (!key || typeof key !== 'string') return false;
            if (MEMORY_CONFIG.VALIDATION_ENABLED && !Utils.validateData(value)) return false;

            if (this.data.size >= MEMORY_CONFIG.MAX_CACHE_ITEMS) {
                this.evictLRU();
                this.metadata.evictions++;
            }

            const deepCopy = Utils.deepClone(value);
            const compressed = AdvancedCompressor.compress(deepCopy);

            const item = {
                value: compressed,
                timestamp: Date.now(),
                expires: Date.now() + ttl,
                size: Utils.getSize(compressed),
                accessCount: 0,
                lastAccessed: Date.now(),
                id: Utils.generateId()
            };

            this.data.set(key, item);
            this.updateMetadata();
            this.scheduleWrite(key);
            return true;
        }

        get(key) {
            if (!key || typeof key !== 'string') {
                this.metadata.misses++;
                return null;
            }

            const item = this.data.get(key);
            if (!item) {
                this.metadata.misses++;
                return null;
            }

            if (Date.now() > item.expires) {
                this.data.delete(key);
                this.metadata.misses++;
                this.scheduleWrite();
                return null;
            }

            item.accessCount = (item.accessCount || 0) + 1;
            item.lastAccessed = Date.now();
            this.metadata.hits++;
            this.updateMetadata();

            try {
                return AdvancedCompressor.decompress(item.value);
            } catch {
                return null;
            }
        }

        delete(key) {
            if (!key || typeof key !== 'string') return false;
            const deleted = this.data.delete(key);
            if (deleted) {
                this.updateMetadata();
                this.scheduleWrite();
            }
            return deleted;
        }

        clear() {
            this.data.clear();
            this.metadata.hits = 0;
            this.metadata.misses = 0;
            this.metadata.evictions = 0;
            this.updateMetadata();
            this.saveToStorage();
            this.showStatus('🧹 تم تنظيف الذاكرة بالكامل', 'success');
        }

        evictLRU() {
            let oldest = null;
            let oldestTime = Infinity;
            for (const [key, item] of this.data) {
                if (item.lastAccessed < oldestTime) {
                    oldestTime = item.lastAccessed;
                    oldest = key;
                }
            }
            if (oldest) {
                this.data.delete(oldest);
                this.metadata.evictions++;
                return true;
            }
            return false;
        }

        cleanup() {
            const now = Date.now();
            let count = 0;
            let sizeFreed = 0;

            for (const [key, item] of this.data) {
                if (now > item.expires) {
                    sizeFreed += item.size || 0;
                    this.data.delete(key);
                    count++;
                }
            }

            if (count > 0) {
                this.updateMetadata();
                this.scheduleWrite();
                this.showStatus(`🧹 تم تنظيف ${count} عناصر منتهية الصلاحية`, 'info');
            }

            this.metadata.lastCleanup = now;
            return { count, sizeFreed };
        }

        startAutoCleanup() {
            setInterval(() => this.cleanup(), MEMORY_CONFIG.AUTO_CLEANUP_INTERVAL);
        }

        scheduleWrite(key = null) {
            if (key) this.pendingWrites.set(key, Date.now());
            clearTimeout(this._writeTimeout);
            this._writeTimeout = setTimeout(() => this.saveToStorage(), MEMORY_CONFIG.DEBOUNCE_DELAY);
        }

        saveToStorage() {
            if (this.isWriting) return;
            this.isWriting = true;

            try {
                const data = {
                    entries: Array.from(this.data.entries()),
                    metadata: this.metadata,
                    version: '4.0',
                    timestamp: Date.now()
                };
                localStorage.setItem(MEMORY_CONFIG.CACHE_KEY, JSON.stringify(data));
                this.pendingWrites.clear();
            } catch (error) {
                if (error.name === 'QuotaExceededError') this.handleQuotaExceeded();
                console.warn('⚠️ فشل حفظ الكاش:', error.message);
            }
            this.isWriting = false;
        }

        handleQuotaExceeded() {
            this.showStatus('⚠️ مساحة التخزين ممتلئة، جاري التنظيف...', 'error');
            const items = Array.from(this.data.entries()).sort((a, b) => (b[1].size || 0) - (a[1].size || 0));
            const toDelete = Math.ceil(items.length * 0.4);
            for (let i = 0; i < toDelete && i < items.length; i++) {
                this.data.delete(items[i][0]);
            }
            this.updateMetadata();
            this.saveToStorage();
        }

        loadFromStorage() {
            try {
                const saved = localStorage.getItem(MEMORY_CONFIG.CACHE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.entries) {
                        this.data = new Map(data.entries);
                        this.metadata = data.metadata || this.metadata;
                    }
                }
            } catch (error) {
                console.warn('⚠️ فشل تحميل الكاش:', error.message);
            }
        }

        updateMetadata() {
            let totalSize = 0;
            for (const [, item] of this.data) {
                totalSize += item.size || 0;
            }
            this.metadata.totalSize = totalSize;
            this.metadata.itemCount = this.data.size;
            this.metadata.avgSize = this.data.size > 0 ? totalSize / this.data.size : 0;
        }

        showStatus(message, type = 'info') {
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[SmartCache] ${type}: ${message}`);
            }
        }

        getStats() {
            const total = this.metadata.hits + this.metadata.misses;
            const hitRate = total > 0 ? Math.round((this.metadata.hits / total) * 100) : 0;
            const totalStorage = Utils.getTotalStorageSize();
            const storageLimit = Utils.getStorageLimit();

            return {
                items: this.data.size,
                maxItems: MEMORY_CONFIG.MAX_CACHE_ITEMS,
                hits: this.metadata.hits,
                misses: this.metadata.misses,
                evictions: this.metadata.evictions,
                hitRate: hitRate,
                totalSize: this.metadata.totalSize,
                sizeFormatted: Utils.formatSize(this.metadata.totalSize),
                avgSize: Utils.formatSize(this.metadata.avgSize || 0),
                lastCleanup: new Date(this.metadata.lastCleanup).toLocaleString('ar-SA'),
                created: new Date(this.metadata.created).toLocaleString('ar-SA'),
                pendingWrites: this.pendingWrites.size,
                isWriting: this.isWriting,
                utilization: Math.round((this.data.size / MEMORY_CONFIG.MAX_CACHE_ITEMS) * 100),
                totalStorage: totalStorage,
                totalStorageFormatted: Utils.formatSize(totalStorage),
                storageLimit: storageLimit,
                storageLimitFormatted: Utils.formatSize(storageLimit),
                storageRemaining: storageLimit - totalStorage,
                storageRemainingFormatted: Utils.formatSize(Math.max(0, storageLimit - totalStorage)),
                storageUsagePercent: storageLimit > 0 ? Math.round((totalStorage / storageLimit) * 100) : 0
            };
        }
    }

    // ============================================================
    //  نظام النسخ الاحتياطي
    // ============================================================
    class AdvancedBackup {
        constructor() {
            this.key = MEMORY_CONFIG.BACKUP_KEY;
            this.backup = null;
            this.load();
        }

        create(data, options = {}) {
            const { label = 'النسخة الاحتياطية', type = 'manual', metadata = {} } = options;
            if (!data) {
                this.showStatus('❌ لا توجد بيانات للنسخ الاحتياطي', 'error');
                return null;
            }

            const cleanData = Utils.deepClone(data);
            const compressed = AdvancedCompressor.compress(cleanData);
            const size = Utils.getSize(compressed);

            const backup = {
                id: Utils.generateId(),
                version: '4.0',
                timestamp: Date.now(),
                date: new Date().toLocaleString('ar-SA'),
                label: label,
                type: type,
                size: size,
                sizeFormatted: Utils.formatSize(size),
                data: compressed,
                metadata: {
                    ...metadata,
                    itemCount: Array.isArray(data) ? data.length : (data ? Object.keys(data).length : 0),
                    compressed: MEMORY_CONFIG.COMPRESSION_ENABLED,
                    checksum: this.generateChecksum(compressed)
                }
            };

            this.backup = backup;
            this.save();
            this.showStatus(`💾 تم حفظ نسخة احتياطية جديدة (استبدلت القديمة)`, 'success');
            return backup;
        }

        restore() {
            if (!this.backup) {
                this.showStatus('❌ لا توجد نسخة احتياطية', 'error');
                return null;
            }
            try {
                const data = AdvancedCompressor.decompress(this.backup.data);
                this.showStatus(`♻️ تم استعادة: ${this.backup.label} (${this.backup.date})`, 'info');
                return data;
            } catch (error) {
                this.showStatus('❌ فشل استعادة البيانات: ' + error.message, 'error');
                return null;
            }
        }

        get() {
            return this.backup ? { ...this.backup, data: undefined } : null;
        }

        getFull() {
            return this.backup ? { ...this.backup } : null;
        }

        save() {
            try {
                if (this.backup) {
                    localStorage.setItem(this.key, JSON.stringify(this.backup));
                }
            } catch (error) {
                if (error.name === 'QuotaExceededError') {
                    this.showStatus('⚠️ مساحة التخزين ممتلئة، جاري حذف القديمة...', 'error');
                    localStorage.removeItem(this.key);
                    localStorage.setItem(this.key, JSON.stringify(this.backup));
                }
            }
        }

        load() {
            try {
                const saved = localStorage.getItem(this.key);
                if (saved) {
                    this.backup = JSON.parse(saved);
                    if (this.backup.version !== '4.0') {
                        this.backup.version = '4.0';
                        this.save();
                    }
                }
            } catch (error) {
                this.backup = null;
            }
        }

        delete() {
            this.backup = null;
            localStorage.removeItem(this.key);
            this.showStatus('🗑️ تم حذف النسخة الاحتياطية', 'info');
        }

        exists() {
            return this.backup !== null;
        }

        generateChecksum(data) {
            try {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return hash.toString(16);
            } catch {
                return '0';
            }
        }

        showStatus(message, type = 'info') {
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[AdvancedBackup] ${type}: ${message}`);
            }
        }
    }

// ================================================================
//  🧠 Soufai Memory Manager v5.0 - الكود الكامل
//  ✅ النسخ التلقائي مسموح
//  ❌ النسخ اليدوي ممنوع
//  ✅ الزر يظهر في شريط الأزرار
//  ✅ ممنوع العمل من النسخة المحلية أثناء وجود النت
// ================================================================

(function() {
    'use strict';

    // ============================================================
    //  الإعدادات
    // ============================================================
    const MEMORY_CONFIG = {
        CACHE_KEY: 'soufai_memory_v4',
        MAX_CACHE_ITEMS: 100,
        MAX_CACHE_AGE: 30 * 60 * 1000,
        COMPRESSION_ENABLED: true,
        AUTO_CLEANUP_INTERVAL: 5 * 60 * 1000,
        VALIDATION_ENABLED: true
    };

    // ============================================================
    //  أدوات مساعدة
    // ============================================================
    const Utils = {
        generateId: () => Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
        
        formatSize: (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },
        
        getTotalStorageSize: () => {
            let total = 0;
            try {
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length * 2;
                    }
                }
            } catch(e) {}
            return total;
        },
        
        getStorageLimit: () => {
            try {
                const test = 'a'.repeat(1024 * 1024 * 10);
                localStorage.setItem('_test_', test);
                localStorage.removeItem('_test_');
                return 10 * 1024 * 1024;
            } catch(e) {
                return 5 * 1024 * 1024;
            }
        },
        
        deepClone: (obj) => {
            if (obj === null || typeof obj !== 'object') return obj;
            if (obj instanceof Date) return new Date(obj);
            if (Array.isArray(obj)) return obj.map(item => Utils.deepClone(item));
            const cloned = {};
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    cloned[key] = Utils.deepClone(obj[key]);
                }
            }
            return cloned;
        },
        
        getSize: (data) => {
            try {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                return new Blob([str]).size;
            } catch {
                return 0;
            }
        }
    };

    // ============================================================
    //  ضاغط
    // ============================================================
    class AdvancedCompressor {
        static compress(data) {
            if (!MEMORY_CONFIG.COMPRESSION_ENABLED) return data;
            try {
                const json = typeof data === 'string' ? data : JSON.stringify(data);
                return json.replace(/\s+/g, ' ').replace(/\n/g, '');
            } catch {
                return data;
            }
        }

        static decompress(data) {
            try {
                if (typeof data === 'string') {
                    return JSON.parse(data);
                }
                return data;
            } catch {
                return data;
            }
        }
    }

    // ============================================================
    //  نظام التخزين المؤقت
    // ============================================================
    class SmartCache {
        constructor() {
            this.data = new Map();
            this.metadata = {
                created: Date.now(),
                hits: 0,
                misses: 0,
                evictions: 0,
                totalSize: 0,
                lastCleanup: Date.now()
            };
            this.isWriting = false;
            this.loadFromStorage();
            this.startAutoCleanup();
        }

        set(key, value, ttl = MEMORY_CONFIG.MAX_CACHE_AGE) {
            if (!key || typeof key !== 'string') return false;

            if (this.data.size >= MEMORY_CONFIG.MAX_CACHE_ITEMS) {
                this.evictLRU();
                this.metadata.evictions++;
            }

            const deepCopy = Utils.deepClone(value);
            const compressed = AdvancedCompressor.compress(deepCopy);

            const item = {
                value: compressed,
                timestamp: Date.now(),
                expires: Date.now() + ttl,
                size: Utils.getSize(compressed),
                accessCount: 0,
                lastAccessed: Date.now(),
                id: Utils.generateId()
            };

            this.data.set(key, item);
            this.updateMetadata();
            this.saveToStorage();
            return true;
        }

        get(key) {
            if (!key || typeof key !== 'string') {
                this.metadata.misses++;
                return null;
            }

            // 🔥🔥🔥 ممنوع استخدام الكاش أثناء وجود النت 🔥🔥🔥
            if (navigator.onLine) {
                this.metadata.misses++;
                return null;
            }

            const item = this.data.get(key);
            if (!item) {
                this.metadata.misses++;
                return null;
            }

            if (Date.now() > item.expires) {
                this.data.delete(key);
                this.metadata.misses++;
                this.saveToStorage();
                return null;
            }

            item.accessCount = (item.accessCount || 0) + 1;
            item.lastAccessed = Date.now();
            this.metadata.hits++;
            this.updateMetadata();

            try {
                return AdvancedCompressor.decompress(item.value);
            } catch {
                return null;
            }
        }

        delete(key) {
            if (!key || typeof key !== 'string') return false;
            const deleted = this.data.delete(key);
            if (deleted) {
                this.updateMetadata();
                this.saveToStorage();
            }
            return deleted;
        }

        clear() {
            this.data.clear();
            this.metadata.hits = 0;
            this.metadata.misses = 0;
            this.metadata.evictions = 0;
            this.updateMetadata();
            this.saveToStorage();
            this.showStatus('🧹 تم تنظيف الكاش بالكامل', 'success');
        }

        evictLRU() {
            let oldest = null;
            let oldestTime = Infinity;
            for (const [key, item] of this.data) {
                if (item.lastAccessed < oldestTime) {
                    oldestTime = item.lastAccessed;
                    oldest = key;
                }
            }
            if (oldest) {
                this.data.delete(oldest);
                this.metadata.evictions++;
                return true;
            }
            return false;
        }

        cleanup() {
            const now = Date.now();
            let count = 0;
            let sizeFreed = 0;

            for (const [key, item] of this.data) {
                if (now > item.expires) {
                    sizeFreed += item.size || 0;
                    this.data.delete(key);
                    count++;
                }
            }

            if (count > 0) {
                this.updateMetadata();
                this.saveToStorage();
                this.showStatus(`🧹 تم تنظيف ${count} عناصر منتهية الصلاحية`, 'info');
            }

            this.metadata.lastCleanup = now;
            return { count, sizeFreed };
        }

        startAutoCleanup() {
            setInterval(() => this.cleanup(), MEMORY_CONFIG.AUTO_CLEANUP_INTERVAL);
        }

        saveToStorage() {
            if (this.isWriting) return;
            this.isWriting = true;

            try {
                const data = {
                    entries: Array.from(this.data.entries()),
                    metadata: this.metadata,
                    version: '5.0',
                    timestamp: Date.now()
                };
                localStorage.setItem(MEMORY_CONFIG.CACHE_KEY, JSON.stringify(data));
            } catch (error) {
                console.warn('⚠️ فشل حفظ الكاش:', error.message);
            }
            this.isWriting = false;
        }

        loadFromStorage() {
            try {
                const saved = localStorage.getItem(MEMORY_CONFIG.CACHE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.entries) {
                        this.data = new Map(data.entries);
                        this.metadata = data.metadata || this.metadata;
                    }
                }
            } catch (error) {
                console.warn('⚠️ فشل تحميل الكاش:', error.message);
            }
        }

        updateMetadata() {
            let totalSize = 0;
            for (const [, item] of this.data) {
                totalSize += item.size || 0;
            }
            this.metadata.totalSize = totalSize;
            this.metadata.itemCount = this.data.size;
            this.metadata.avgSize = this.data.size > 0 ? totalSize / this.data.size : 0;
        }

        showStatus(message, type = 'info') {
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[Cache] ${type}: ${message}`);
            }
        }

        getStats() {
            const total = this.metadata.hits + this.metadata.misses;
            const hitRate = total > 0 ? Math.round((this.metadata.hits / total) * 100) : 0;
            const totalStorage = Utils.getTotalStorageSize();
            const storageLimit = Utils.getStorageLimit();

            return {
                items: this.data.size,
                maxItems: MEMORY_CONFIG.MAX_CACHE_ITEMS,
                hits: this.metadata.hits,
                misses: this.metadata.misses,
                evictions: this.metadata.evictions,
                hitRate: hitRate,
                totalSize: this.metadata.totalSize,
                sizeFormatted: Utils.formatSize(this.metadata.totalSize),
                avgSize: Utils.formatSize(this.metadata.avgSize || 0),
                lastCleanup: new Date(this.metadata.lastCleanup).toLocaleString('ar-SA'),
                created: new Date(this.metadata.created).toLocaleString('ar-SA'),
                utilization: Math.round((this.data.size / MEMORY_CONFIG.MAX_CACHE_ITEMS) * 100),
                totalStorage: totalStorage,
                totalStorageFormatted: Utils.formatSize(totalStorage),
                storageLimit: storageLimit,
                storageLimitFormatted: Utils.formatSize(storageLimit),
                storageRemaining: storageLimit - totalStorage,
                storageRemainingFormatted: Utils.formatSize(Math.max(0, storageLimit - totalStorage)),
                storageUsagePercent: storageLimit > 0 ? Math.round((totalStorage / storageLimit) * 100) : 0
            };
        }
    }

                memoryRemaining: cacheStats.storageRemainingFormatted,
                memoryUsagePercent: cacheStats.storageUsagePercent
            };
        }

        formatUptime() {
            const diff = Date.now() - this.initialized;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            return `${minutes}m ${seconds}s`;
        }

        addListener(fn) {
            if (typeof fn === 'function') {
                this.listeners.push(fn);
                fn(this.getStats());
                return true;
            }
            return false;
        }

        removeListener(fn) {
            const index = this.listeners.indexOf(fn);
            if (index > -1) {
                this.listeners.splice(index, 1);
                return true;
            }
            return false;
        }

        notifyListeners() {
            const stats = this.getStats();
            this.listeners.forEach(fn => {
                try { fn(stats); } catch (error) {}
            });
        }

        showStatus(message, type = 'info') {
            this.events.push({ message, type, time: Date.now() });
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[MemoryManager] ${type}: ${message}`);
            }
        }

// ===== تمييز الصف عند النقر على الاسم - تغيير اللون بالكامل =====
(function() {
    'use strict';

    function handleClick(e) {
        var td = e.target.closest('td');
        if (!td) return;

        var tr = td.closest('tr');
        if (!tr) return;

        // تجاهل الصفوف الخاصة
        if (tr.classList.contains('row-0') || 
            tr.classList.contains('row-1') || 
            tr.classList.contains('total-row')) {
            return;
        }

        // معرفة رقم العمود
        var cells = tr.querySelectorAll('td');
        var colIndex = -1;
        for (var i = 0; i < cells.length; i++) {
            if (cells[i] === td) {
                colIndex = i;
                break;
            }
        }

        // فقط العمود الثاني (الاسم)
        if (colIndex !== 1) return;

        // إذا كانت الخلية قابلة للتعديل ولا نريد التداخل
        if (td.classList.contains('editable') && td.isContentEditable) return;

        // إزالة التحديد من جميع الصفوف
        document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
            row.classList.remove('selected-row');
        });

        // تمييز الصف المحدد
        tr.classList.add('selected-row');
        tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function init() {
        var table = document.getElementById('tableWrapper');
        if (!table) {
            setTimeout(init, 300);
            return;
        }
        table.removeEventListener('click', handleClick);
        table.addEventListener('click', handleClick);
        console.log('✅ تم تفعيل تمييز الصف - تغيير اللون بالكامل');
    }

    // دوال عامة
    window.clearRowHighlight = function() {
        document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
            row.classList.remove('selected-row');
        });
    };

    window.highlightRow = function(index) {
        var rows = document.querySelectorAll('#tableWrapper tbody tr');
        if (rows[index]) {
            document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
                row.classList.remove('selected-row');
            });
            rows[index].classList.add('selected-row');
            rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // مراقبة التغييرات
    var observer = new MutationObserver(function() {
        var table = document.getElementById('tableWrapper');
        if (table) {
            init();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
})();

<!-- ===== تحديث الساعة والتاريخ الهجري في شاشة الدخول ===== -->
<script>
(function() {
    'use strict';

    // ============================================================
    //  دالة تحويل التاريخ الميلادي إلى هجري
    // ============================================================
    function toHijri(date) {
        const g = date.getDate();
        const m = date.getMonth() + 1;
        const y = date.getFullYear();

        let jd = Math.floor((1461 * (y + 4800 + Math.floor((m - 14) / 12))) / 4) +
                 Math.floor((367 * (m - 2 - 12 * Math.floor((m - 14) / 12))) / 12) -
                 Math.floor((3 * Math.floor((y + 4900 + Math.floor((m - 14) / 12)) / 100)) / 4) +
                 g - 32075;

        let l = jd - 1948440 + 10632;
        let n = Math.floor((l - 1) / 10631);
        l = l - 10631 * n + 354;
        let j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) +
                (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
        l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) -
            (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
        let month = Math.floor((24 * l) / 709);
        let day = l - Math.floor((709 * month) / 24);
        let year = 30 * n + j - 30;

        const hijriMonths = ['محرم', 'صفر', 'ربيع الأول', 'ربيع الثاني', 'جمادى الأولى', 'جمادى الآخرة',
            'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة'
        ];

        return day + ' ' + hijriMonths[month - 1] + ' ' + year + ' هـ';
    }

    // ============================================================
    //  تحديث الساعة والتاريخ (نظام 12 ساعة)
    // ============================================================
    function updateClock() {
        const now = new Date();

        // ===== الساعة بنظام 12 ساعة مع AM/PM بالعربية =====
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'م' : 'ص';
        hours = hours % 12;
        hours = hours ? hours : 12;  // 12 بدلاً من 0
        const h = String(hours).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const timeString = h + ':' + m + ':' + s + ' ' + ampm;

        // التاريخ الميلادي
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
            'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
        ];
        const dateString = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
        const dayString = days[now.getDay()];

        // التاريخ الهجري
        const hijriString = toHijri(now);

        // تحديث العناصر
        const clockEl = document.getElementById('clockDisplay');
        const dateEl = document.getElementById('dateDisplay');
        const dayEl = document.getElementById('dayDisplay');
        const hijriEl = document.getElementById('hijriDisplay');

        if (clockEl) clockEl.textContent = timeString;
        if (dateEl) dateEl.textContent = dateString;
        if (dayEl) dayEl.textContent = dayString;
        if (hijriEl) hijriEl.textContent = hijriString;
    }

    // تحديث كل ثانية
    updateClock();
    setInterval(updateClock, 1000);

    console.log('✅ تم تفعيل الساعة بنظام 12 ساعة والتاريخ الهجري');
})();
</script>

    function patchDebtButton() {

        const debtBtn = document.querySelector('[title="المديونيات العالية (5000+)"]');
        if (debtBtn) {
            // التأكد من أن الزر ليس مربوطاً بالفعل
            if (debtBtn.dataset.patched === 'true') return;
            
            // إزالة الحدث القديم وإضافة الحدث الجديد
            const newBtn = debtBtn.cloneNode(true);
            debtBtn.parentNode.replaceChild(newBtn, debtBtn);
            
            newBtn.dataset.patched = 'true';
            newBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                // التحقق من وجود بيانات قبل التنفيذ
                const table = document.querySelector('#tableWrapper table');
                if (!table) {
                    alert('⚠️ الرجاء تسجيل الدخول أولاً ثم تحميل البيانات');
                    return;
                }
                window.fetchHighDebtSubscribers();
            });
            
            console.log('✅ تم إصلاح زر المديونيات');
            isReady = true;
            return true;
        }
        return false;
    }

    // ============================================================
    //  محاولة متكررة للعثور على الزر (حتى بعد تسجيل الدخول)
    // ============================================================

    function waitForButton() {
        if (patchDebtButton()) {
            console.log('✅ زر المديونيات جاهز للعمل');
            return;
        }
        
        retryCount++;
        if (retryCount < MAX_RETRIES) {
            console.log(`⏳ جاري انتظار زر المديونيات... (${retryCount}/${MAX_RETRIES})`);
            setTimeout(waitForButton, 1000);
        } else {
            console.warn('⚠️ لم يتم العثور على زر المديونيات بعد عدة محاولات');
        }
    }

    // ============================================================
    //  مراقبة التغييرات في DOM
    // ============================================================

    function startObserver() {
        const observer = new MutationObserver(function(mutations) {
            for (const mutation of mutations) {
                if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                    // التحقق من وجود زر المديونيات
                    const btn = document.querySelector('[title="المديونيات العالية (5000+)"]');
                    if (btn && !btn.dataset.patched) {
                        patchDebtButton();
                        console.log('✅ تم اكتشاف زر المديونيات وتصليحه');
                    }
                }
            }
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        console.log('👀 جاري مراقبة الصفحة لاكتشاف زر المديونيات...');
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(waitForButton, 1000);
            startObserver();
        });
    } else {
        setTimeout(waitForButton, 1000);
        startObserver();
    }

    console.log('✅ نظام المديونيات العالية جاهز (ينتظر تسجيل الدخول)');

})();
</script>

    <script>
    (function() {
        'use strict';
        
        const banner = document.getElementById('pwaInstallBanner');
        const btn = document.getElementById('btnInstallPWA');
        let deferredPrompt = null;
        
        // ===== التحقق إذا كان التطبيق مثبتاً =====
        function isAppInstalled() {
            // 1- وضع ملء الشاشة (Android/Desktop)
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }
            // 2- iOS
            if (window.navigator.standalone === true) {
                return true;
            }
            // 3- تخزين محلي
            if (localStorage.getItem('soufai_app_installed') === 'true') {
                return true;
            }
            return false;
        }
        
        // ===== إخفاء البanner نهائياً =====
        function hideBannerPermanently() {
            if (banner) {
                banner.style.display = 'none';
                banner.style.opacity = '0';
                banner.style.pointerEvents = 'none';
            }
            localStorage.setItem('soufai_app_installed', 'true');
        }
        
        // ===== إظهار البanner =====
        function showBanner() {
            if (banner && !isAppInstalled()) {
                banner.style.display = 'flex';
                banner.style.opacity = '1';
                banner.style.pointerEvents = 'auto';
            }
        }
        
        // ===== حدث التثبيت =====
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            
            // إظهار البanner بعد 2 ثانية
            setTimeout(function() {
                if (!isAppInstalled()) {
                    showBanner();
                }
            }, 2000);
        });
        
        // ===== زر التثبيت =====
        if (btn) {
            btn.addEventListener('click', async function() {
                if (!deferredPrompt) {
                    // إذا لم يظهر حدث التثبيت، نعرض تعليمات يدوية
                    let msg = '📲 للتثبيت على الجوال:\n';
                    msg += '• Android: اضغط ⋮ > تثبيت التطبيق\n';
                    msg += '• iPhone: اضغط ⬆️ > إضافة للشاشة الرئيسية\n';
                    msg += '• الكمبيوتر: اضغط على أيقونة التثبيت في شريط العنوان';
                    alert(msg);
                    return;
                }
                
                deferredPrompt.prompt();
                
                const { outcome } = await deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    console.log('✅ تم تثبيت التطبيق');
                    hideBannerPermanently();
                } else {
                    console.log('❌ تم رفض التثبيت');
                    // نعيد ظهور البanner لاحقاً
                    setTimeout(showBanner, 60000); // بعد دقيقة
                }
                
                deferredPrompt = null;
            });
        }
        
        // ===== بعد التثبيت الناجح =====

        });
        
        // ===== فحص فوري عند تحميل الصفحة =====
        if (isAppInstalled()) {

            setTimeout(function() {

                alert('📲 استخدم قائمة المتصفح > تثبيت التطبيق');

        };
        
        window.hideInstallBanner = hideBannerPermanently;
        
    })();

<script>
(function() {
    'use strict';
    
    // ===== تحميل Chart.js من عدة روابط بديلة =====
    function loadChartJS() {
        const urls = [
            'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js',
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
            'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
        ];
        
        let index = 0;
        
        function tryLoad() {
            if (index >= urls.length) {
                console.error('❌ فشل تحميل Chart.js من جميع الروابط');
                // showToast('❌ فشل تحميل مكتبة الرسوم البيانية', 'error'); // تم حذفه
                return;
            }
            
            const url = urls[index];
            console.log(`⏳ محاولة تحميل Chart.js من: ${url}`);
            
            const script = document.createElement('script');
            script.src = url;
            script.onload = function() {
                console.log('✅ تم تحميل Chart.js بنجاح من:', url);
                window.ChartLoaded = true;
                // showToast('✅ تم تحميل الرسوم البيانية بنجاح', 'success'); // تم حذفه
                setTimeout(() => {
                    const event = new CustomEvent('toggleCharts', { 
                        detail: { visible: true } 
                    });
                    document.dispatchEvent(event);
                }, 500);
            };
            script.onerror = function() {
                console.warn(`⚠️ فشل التحميل من: ${url}`);
                index++;
                tryLoad();
            };
            document.head.appendChild(script);
        }
        
        tryLoad();
    }
    
    // ===== دالة عرض رسالة (محذوفة بالكامل) =====
    // function showToast(message, type) { ... }
    
    // ===== إضافة أنماط CSS =====
    const style = document.createElement('style');

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    `;
    document.head.appendChild(style);
    
    // ===== بدء التحميل =====
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadChartJS, 1000);
        });
    } else {
        setTimeout(loadChartJS, 1000);
    }
    
    // ===== مراقبة زر الرسوم (تم حذف التنبيه) =====
    document.addEventListener('click', function(e) {
        const target = e.target.closest('[title*="الرسوم"]') || 
                       e.target.closest('[title="عرض الرسوم"]');
        if (target) {
            if (!window.ChartLoaded) {
                // showToast('⏳ جاري تحميل مكتبة الرسوم...', 'info'); // تم حذفه
                loadChartJS();

        }
    });
    
    console.log('✅ تم تفعيل تحميل Chart.js من روابط بديلة');
})();

                'soufai_cache_data',
                'soufai_pending_changes',
                'soufai_backups',
                'soufai_memory_v4',
                'soufai_backup_v4',
                'soufai_sync_queue_v5',
                'soufai_report_cache',
                'soufai_last_village',
                'waterSystem_dataSaver',
                'waterSystem_quickView',
                'auditLogs',
                'customUsers',
                'focusMode',
                'soufai_app_installed'
            ];
            
            let removedCount = 0;
            keysToRemove.forEach(key => {

                    localStorage.removeItem(key);

<script>
(function() {
    'use strict';

    // ============================================================
    //  🎯 تمييز الصف عند النقر على الاسم - تغيير اللون بالكامل
    // ============================================================

    let selectedRow = null;

    function handleNameClick(e) {
        // البحث عن الخلية التي تم النقر عليها
        let td = e.target.closest('td');
        if (!td) return;

        // التأكد من أن العمود هو الثاني (الاسم)
        let allCells = td.parentElement.querySelectorAll('td');
        let colIndex = -1;
        for (let i = 0; i < allCells.length; i++) {
            if (allCells[i] === td) {
                colIndex = i;
                break;
            }
        }

        // فقط العمود الثاني (الاسم)
        if (colIndex !== 1) return;

        // الصف الذي تم النقر عليه
        let tr = td.closest('tr');
        if (!tr) return;

        // تجاهل الصفوف الخاصة
        if (tr.classList.contains('row-0') || 
            tr.classList.contains('row-1') || 
            tr.classList.contains('total-row')) {
            return;
        }

        // تجاهل إذا كانت الخلية قابلة للتعديل (نترك التعديل يعمل)
        if (td.classList.contains('editable') && td.isContentEditable) {
            return;
        }

        // إزالة التحديد من الصف السابق
        if (selectedRow) {
            selectedRow.classList.remove('selected-row');
            selectedRow.style.background = '';
            selectedRow.style.color = '';
        }

        // تمييز الصف الحالي
        tr.classList.add('selected-row');
        selectedRow = tr;

        // تطبيق الألوان مباشرة للتأكيد
        tr.style.background = 'linear-gradient(135deg, #1a237e, #0d47a1, #1565c0)';
        tr.style.color = '#ffffff';
        tr.style.borderTop = '3px solid #ffd700';
        tr.style.borderBottom = '3px solid #ffd700';
        tr.style.boxShadow = '0 0 50px rgba(13, 71, 161, 0.4)';
        tr.style.transform = 'scale(1.005)';

        // تمييز العمود 13 (المتبقي) بشكل خاص
        let cells = tr.querySelectorAll('td');
        if (cells.length > 12) {
            cells[12].style.background = 'linear-gradient(135deg, #ff6f00, #e65100, #bf360c)';
            cells[12].style.color = '#ffffff';
            cells[12].style.fontWeight = '900';
            cells[12].style.fontSize = '20px';

        console.log(`✅ تم تمييز: ${cells[1]?.textContent || 'غير معروف'}`);
    }

    // ============================================================
    //  دالة لإزالة التمييز

    window.clearRowHighlight = function() {
        if (selectedRow) {
            selectedRow.classList.remove('selected-row');
            selectedRow.style.background = '';
            selectedRow.style.color = '';
            selectedRow.style.borderTop = '';
            selectedRow.style.borderBottom = '';
            selectedRow.style.boxShadow = '';
            selectedRow.style.transform = '';

            // إعادة تعيين الخلايا
            let cells = selectedRow.querySelectorAll('td');
            cells.forEach(cell => {
                cell.style.background = '';

                cell.style.borderLeft = '';

        }
    };

    // ============================================================
    //  دالة لتمييز صف معين برقمه
    // ============================================================

    window.highlightRow = function(index) {
        let rows = document.querySelectorAll('#tableWrapper tbody tr');
        if (rows[index]) {
            // محاكاة النقر على الاسم في ذلك الصف
            let nameCell = rows[index].querySelector('td:nth-child(2)');
            if (nameCell) {
                let event = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                nameCell.dispatchEvent(event);
            }
        }
    };

    // ============================================================
    //  تهيئة النظام
    // ============================================================

    function init() {
        let table = document.getElementById('tableWrapper');
        if (!table) {
            setTimeout(init, 300);
            return;
        }

        // إزالة المستمع القديم لتجنب التكرار
        table.removeEventListener('click', handleNameClick);
        table.addEventListener('click', handleNameClick);

        console.log('✅ تم تفعيل تمييز الصف عند النقر على الاسم');
    }

    // ============================================================
    //  بدء التشغيل

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // ============================================================
    //  مراقبة التغييرات في الجدول
    // ============================================================

    let observer = new MutationObserver(function() {
        let table = document.getElementById('tableWrapper');
        if (table) {
            init();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('🎯 نظام تمييز الصف جاهز - انقر على أي اسم لتمييز الصف');

const fetchAllForSms = useCallback(async () => {
    setSmsAllLoading(true);
    const results = [];
    
    for (const v of VILLAGES_LIST) {
        try {
            const apiUrl = villageAPIs[v];
            if (!apiUrl) continue;
            
            const url = `${apiUrl}?sheet=${encodeURIComponent(month)}&t=${Date.now()}`;
            const res = await fetch(url);
            if (!res.ok) continue;
            
            const data = await res.json();
            if (!data || !Array.isArray(data)) continue;
            
            for (let i = 2; i < data.length - 1; i++) {
                const row = data[i];
                if (!row || !row[1] || row[1] === 'الاسم') continue;
                
                const phone = (row[0] || '').toString().trim();
                if (!phone || phone.length < 9) continue;
                
                results.push({
                    village: v,
                    meterNumber: row[0] || '-',
                    name: row[1] || 'غير معروف',
                    phone: phone,
                    previous: row[2] || 0,
                    current: row[3] || 0,
                    total: parseFloat(row[9] || 0),

                });

        } catch (e) {

        }
    }
    
    results.sort((a, b) => a.name.localeCompare(b.name));
    setSmsAllData(results);
    setSmsAllLoading(false);
    showSync(`✅ تم تحميل ${results.length} مشترك لديهم أرقام هواتف`, 'success');
}, [month, showSync]);

// ===== بناء رسالة المشترك =====
const buildSmsMessage = useCallback((subscriber) => {
    const monthNum = month.replace('شهر ', '');
    const diff = parseFloat(subscriber.current) - parseFloat(subscriber.previous);
    const remaining = parseFloat(subscriber.remaining);
    const warning = remaining >= 5000 ? ' ⚠️ إنذار بالفصل' : '';
    return `فاتورة شهر ${monthNum}: سابقة: ${subscriber.previous}, حالية: ${subscriber.current}, الفارق: ${diff}, المجموع: ${subscriber.total}, المسلم: ${subscriber.paid}, المتبقي: ${subscriber.remaining}${warning}`;
}, [month]);

// ============================================================
//  🚀 إرسال رسالة فردية - أقصى سرعة (بدون أي تأخير)
// ============================================================

const sendSingleSmsAll = useCallback((subscriber) => {
    if (!subscriber) return;
    
    const message = buildSmsMessage(subscriber);
    
    let phone = subscriber.phone.replace(/\s/g, '');
    if (phone.startsWith('0')) phone = phone.substring(1);
    if (phone.length === 9 && phone.startsWith('7')) {
        phone = '+967' + phone;
    }
    
    window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
    
}, [buildSmsMessage]);

    // ============================================================

    // ============================================================
    
    function startTableObserver() {
        const tableWrapper = document.getElementById('tableWrapper');
        if (!tableWrapper) {
            setTimeout(startTableObserver, 500);
            return;
        }
        
        const observer = new MutationObserver(function(mutations) {
            let shouldRecolor = false;
            
            for (const mutation of mutations) {
                if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                    shouldRecolor = true;
                    break;
                }
                if (mutation.type === 'characterData') {
                    shouldRecolor = true;
                    break;
                }
            }
            
            if (shouldRecolor) {
                setTimeout(colorRemainingColumn, 100);
            }
        });

            subtree: true,
            characterData: true
        });

        });

})();

<script>
// ============================================================
//  🎯 نظام الأوامر المتكامل - مع بحث كامل وأزرار متطورة
//  🔥 النسخة النهائية - حل مشكلة الصفوف
// ============================================================

(function() {
    'use strict';

    // ============================================================
    //  📚 دوال البحث المتطورة
    // ============================================================

    function normalizeText(text) {
        if (!text) return '';
        return text.toString().trim()
            .replace(/\s+/g, ' ')
            .replace(/[أإآ]/g, 'ا')
            .replace(/[ة]/g, 'ه')
            .replace(/[ى]/g, 'ي')
            .toLowerCase();
    }

    function parseNumber(value) {
        if (!value) return 0;
        const num = parseFloat(value.toString().replace(/,/g, ''));
        return isNaN(num) ? 0 : num;
    }

    function calculateSimilarity(str1, str2) {
        if (!str1 || !str2) return 0;
        if (str1 === str2) return 1;
        
        const longer = str1.length > str2.length ? str1 : str2;
        const shorter = str1.length > str2.length ? str2 : str1;
        
        if (longer.length === 0) return 1;
        
        const editDistance = levenshteinDistance(longer, shorter);
        return (longer.length - editDistance) / longer.length;
    }

    function levenshteinDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        
        const matrix = [];
        for (let i = 0; i <= b.length; i++) {
            matrix[i] = [i];
        }
        for (let j = 0; j <= a.length; j++) {
            matrix[0][j] = j;
        }
        
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b[i-1] === a[j-1]) {
                    matrix[i][j] = matrix[i-1][j-1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i-1][j-1] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j] + 1
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    // ============================================================
    //  🔍 البحث الثلاثي
    // ============================================================

    function searchByNameTriplet(query, data) {
        if (!data || !data.length || !query) return [];

        const normalizedQuery = normalizeText(query);
        const queryParts = normalizedQuery.split(/\s+/).filter(p => p.length > 0);
        if (queryParts.length === 0) return [];

        const results = [];

        for (let i = 0; i < data.length; i++) {
            const row = data[i];
            if (!row || !row[1]) continue;
            
            // تخطي رأس الجدول إذا وجد
            const secondCell = row[1]?.toString().trim() || '';
            if (secondCell === 'الاسم' || secondCell === 'اسم المشترك' || secondCell === 'Name') {
                continue;
            }

            const originalName = row[1].toString().trim();
            if (!originalName) continue;

            const cleanedDB = normalizeText(originalName);
            const dbParts = cleanedDB.split(/\s+/).filter(p => p.length > 0);

            let searchIndex = 0;
            for (let j = 0; j < dbParts.length && searchIndex < queryParts.length; j++) {
                if (dbParts[j] === queryParts[searchIndex]) {
                    searchIndex++;
                }
            }

            if (searchIndex === queryParts.length) {
                let allPartsFound = true;
                let lastIndex = -1;
                for (const part of queryParts) {
                    const found = cleanedDB.indexOf(part, lastIndex + 1);
                    if (found === -1) {
                        allPartsFound = false;
                        break;
                    }
                    lastIndex = found;
                }

                if (allPartsFound) {
                    results.push({
                        dataIndex: i,
                        meterNumber: row[0] || '',
                        name: originalName,
                        rowData: row,
                        score: 100,
                        matchType: '✅ مطابقة تامة (ثلاثي)',
                        remaining: parseNumber(row[12]),
                        paid: parseNumber(row[11]),
                        total: parseNumber(row[9])
                    });
                    continue;
                }
            }

            let partialScore = 0;
            let matchedCount = 0;

            for (const part of queryParts) {
                if (cleanedDB.includes(part)) {
                    matchedCount++;
                }
            }

            partialScore = Math.round((matchedCount / queryParts.length) * 100);

            if (partialScore >= 80 && queryParts.length >= 2) {
                results.push({
                    dataIndex: i,
                    meterNumber: row[0] || '',
                    name: originalName,
                    rowData: row,
                    score: partialScore,
                    matchType: `🔍 تشابه ${partialScore}%`,
                    remaining: parseNumber(row[12]),
                    paid: parseNumber(row[11]),
                    total: parseNumber(row[9])
                });
            }
        }

        results.sort((a, b) => b.score - a.score);

        const uniqueResults = [];
        const seenNames = new Set();

        for (const r of results) {
            const normalizedName = normalizeText(r.name);
            if (!seenNames.has(normalizedName)) {
                seenNames.add(normalizedName);
                uniqueResults.push(r);
            }
        }

        if (uniqueResults.length === 1) {
            return uniqueResults;
        }

        if (uniqueResults.length > 0 && uniqueResults[0].score === 100) {
            return [uniqueResults[0]];
        }

        return uniqueResults.slice(0, 3);
    }

    //  🧠 البحث الذكي المتطور
    // ============================================================

    function smartSearch(query, data) {
        if (!data || !data.length || !query) return [];

        const q = query.toString().trim();
        const normalizedQ = normalizeText(q);
        const isNumber = /^\d+$/.test(q);
        const results = [];

        for (let i = 0; i < data.length; i++) {
            const row = data[i];
            if (!row || !row[1]) continue;
            
            const secondCell = row[1]?.toString().trim() || '';
            if (secondCell === 'الاسم' || secondCell === 'اسم المشترك' || secondCell === 'Name') {
                continue;
            }

            const name = row[1] ? row[1].toString() : '';
            const meter = row[0] ? row[0].toString() : '';

            if (!name && !meter) continue;

            let score = 0;
            let matchType = '';
            let matchedParts = [];

            if (isNumber) {
                if (meter === q) {
                    score = 100;
                    matchType = 'رقم عداد تام';
                    matchedParts = [meter];
                } else if (meter.includes(q)) {
                    score = 85;
                    matchType = 'رقم عداد جزئي';
                    matchedParts = [meter];
                }
            }

            if (score === 0) {
                const normalizedName = normalizeText(name);

                if (normalizedName === normalizedQ) {
                    score = 100;
                    matchType = 'اسم تام';
                    matchedParts = [name];
                } 
                else if (normalizedName.startsWith(normalizedQ)) {
                    score = 90;
                    matchType = 'يبدأ بـ';
                    matchedParts = [name];
                } 
                else if (normalizedName.includes(normalizedQ)) {
                    score = 80;
                    matchType = 'يحتوي على';
                    matchedParts = [name];
                } 
                else {
                    const similarity = calculateSimilarity(normalizedName, normalizedQ);
                    if (similarity > 0.5) {
                        score = Math.round(similarity * 75);
                        matchType = `تشابه ${Math.round(similarity * 100)}%`;
                        matchedParts = [name];
                    }
                }
            }

            if (score === 0 && q.length >= 3) {
                const tripletResults = searchByNameTriplet(q, data);
                const found = tripletResults.find(r => r.dataIndex === i);
                if (found) {
                    score = found.score;
                    matchType = found.matchType;
                    matchedParts = [name];
                }
            }

            if (score > 0) {
                results.push({
                    dataIndex: i,
                    meterNumber: meter,
                    name: name || 'غير معروف',
                    rowData: row,
                    score: score,
                    matchType: matchType,
                    remaining: parseNumber(row[12]),
                    paid: parseNumber(row[11]),
                    total: parseNumber(row[9]),
                    matchedParts: matchedParts
                });
            }
        }

        results.sort((a, b) => b.score - a.score);
        return results.slice(0, 20);
    }

                result.theme = 'normal';
                result.button = 'طبيعي';

                result.theme = 'night';

                result.hasTheme = true;
                result.theme = 'dark';
                result.button = 'داكن';
                return result;
            }

            result.village = trimmed;
            return result;

        if (trimmed.startsWith('شهر ')) {

            if (/^\d+$/.test(num)) {
                result.hasMonthChange = true;
                result.month = 'شهر ' + num;
                return result;
            }
        }

        if (words.length >= 3 && VILLAGES_LIST.includes(words[0]) && words[1] === 'شهر' && /^\d+$/.test(words[2])) {
            result.village = words[0];
            result.month = 'شهر ' + words[2];
            result.hasVillageChange = true;
            result.hasMonthChange = true;

            if (words.length >= 6) {
                const name = words.slice(3, words.length - 2).join(' ');
                const op = words[words.length - 2];
                const val = words[words.length - 1];
                if (/^\d+$/.test(val) && (op.includes('مسلم') || op.includes('حالي') || op.includes('قراءة'))) {

                    result.name = name.trim();
                    result.operation = op.includes('مسلم') ? 'paid' : 'current';
                    result.value = parseInt(val);
                }
            }
            return result;
        }

        if (words.length >= 3) {
            const last = words[words.length - 1];
            const second = words[words.length - 2];
            if (/^\d+$/.test(last) && (second.includes('مسلم') || second.includes('حالي') || second.includes('قراءة'))) {
                result.hasOperation = true;
                result.name = words.slice(0, words.length - 2).join(' ').trim();
                result.operation = second.includes('مسلم') ? 'paid' : 'current';
                result.value = parseInt(last);
                return result;
            }
        }

        if (trimmed.length >= 1) {
            result.name = trimmed;
        }

        return result;
    }

    // ============================================================

    function advancedFindInTable(query) {
        // ✅ الحصول على الجدول
        const table = document.querySelector('#tableWrapper table');
        if (!table) return [];

        // ✅ الحصول على tbody مباشرة
        const tbody = table.querySelector('tbody');
        if (!tbody) return [];

        // ✅ بناء مصفوفة البيانات من tbody فقط
        const data = [];
        const tbodyRows = tbody.querySelectorAll('tr');
        
        tbodyRows.forEach(row => {
            const cells = row.querySelectorAll('td');
            const rowData = [];
            cells.forEach(cell => {
                rowData.push(cell.textContent?.trim() || '');
            });
            data.push(rowData);
        });

        if (!data.length) return [];

        // ✅ البحث في البيانات (التي تتطابق مع tbody)
        const results = smartSearch(query, data);
        
        // ✅ النتائج ترجع dataIndex الذي يتطابق مع tbody مباشرة
        return results.map(result => {
            const row = tbodyRows[result.dataIndex];
            return {
                ...result,
                rowIndex: result.dataIndex,  // نفس الفهرس
                row: row,
                cells: row?.querySelectorAll('td') || []
            };
        }).filter(r => r.row);
    }

    // ============================================================

    function findButton(texts) {
        const all = document.querySelectorAll('button, .btn, [role="button"], .button, input[type="button"], input[type="submit"]');
        for (const btn of all) {
            const t = btn.textContent?.trim() || '';
            const title = btn.getAttribute('title') || '';
            const aria = btn.getAttribute('aria-label') || '';
            const id = btn.id || '';
            const className = btn.className || '';
            const value = btn.value || '';
            
            const searchText = (t + ' ' + title + ' ' + aria + ' ' + id + ' ' + className + ' ' + value).toLowerCase();
            
            for (const text of texts) {
                if (searchText.includes(text.toLowerCase())) {
                    return btn;
                }
            }
        }
        return null;
    }

    function exitFocusMode() {
        document.body.classList.remove('focus-mode');
        localStorage.setItem('focusMode', 'false');
        const exitBtn = document.getElementById('exitFocusBtnFixed');
        if (exitBtn) exitBtn.style.display = 'none';
        const controlBtn = document.getElementById('exitFocusBtnControl');
        if (controlBtn) controlBtn.style.display = 'none';
        showMessage('👁️ تم إلغاء وضع التركيز');
        return true;
    }

    function enterFocusMode() {
        document.body.classList.add('focus-mode');
        localStorage.setItem('focusMode', 'true');
        const exitBtn = document.getElementById('exitFocusBtnFixed');
        if (exitBtn) exitBtn.style.display = 'flex';
        const controlBtn = document.getElementById('exitFocusBtnControl');
        if (controlBtn) controlBtn.style.display = 'block';
        showMessage('🔍 تم تفعيل وضع التركيز');
        return true;
    }

    function scrollToRow(index) {
        const tbody = document.querySelector('#tableWrapper tbody');
        if (!tbody) return false;
        
        const rows = tbody.querySelectorAll('tr');
        if (rows[index]) {
            document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(r => {
                r.classList.remove('selected-row');
            });
            rows[index].classList.add('selected-row');
            rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            console.log(`✅ تم التمرير إلى الصف رقم ${index}`);
            return true;
        }
        console.log(`❌ لم يتم العثور على الصف رقم ${index}`);
        return false;
    }

    function updateCell(rowIndex, colIndex, value) {
        const tbody = document.querySelector('#tableWrapper tbody');
        if (!tbody) return false;
        
        const rows = tbody.querySelectorAll('tr');
        if (!rows[rowIndex]) return false;

        const cells = rows[rowIndex].querySelectorAll('td');
        if (!cells[colIndex]) return false;

        // مهم: نستخدم نفس مسار التعديل اليدوي حتى يتم تشغيل onBlur
        // الذي يحتوي على الحفظ المحلي والمزامنة.
        // click() ضروري لأن مستمع blur يتم ربطه عند الضغط على الخلية.
        cells[colIndex].click();
        cells[colIndex].textContent = value;
        cells[colIndex].blur();

        return true;
    }

                        <div>
                            <div style="font-weight:bold;">${s.text}</div>
                            <div style="font-size:12px;color:#aaa;">${s.desc || ''}</div>
                        </div>
                    </div>
                `;
            });

            suggestionsContainer.innerHTML = html;
            suggestionsContainer.style.display = 'block';

            suggestionsContainer.querySelectorAll('.suggestion-item').forEach(el => {
                el.addEventListener('click', function() {
                    const text = this.dataset.text;
                    newInput.value = text;
                    suggestionsContainer.style.display = 'none';
                    window.runSmartCommand(text);
                    newInput.value = '';
                });
            });
        });

        document.addEventListener('click', function(e) {
            if (!newInput.parentNode.contains(e.target)) {
                suggestionsContainer.style.display = 'none';
            }
        });

        newInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = this.value.trim();
                if (val) {
                    localStorage.setItem('lastSearch', val);
                    suggestionsContainer.style.display = 'none';
                    window.runSmartCommand(val);
                    this.value = '';
                }
            }
            if (e.key === 'Escape') {
                suggestionsContainer.style.display = 'none';
                this.value = '';
            }
        });

        const box = newInput.closest('.smart-search-box');
        if (box) {
            const btn = document.createElement('button');
            btn.textContent = '▶️';

            btn.onclick = function() {
                const val = newInput.value.trim();
                if (val) {
                    localStorage.setItem('lastSearch', val);
                    suggestionsContainer.style.display = 'none';
                    window.runSmartCommand(val);
                    newInput.value = '';
                }

            box.appendChild(btn);
        }
    }

    // ============================================================
    //  ?? البحث الصوتي
    // ============================================================

    function setupVoiceSearch() {
        const voiceBtn = document.querySelector('.voice-btn');
        if (!voiceBtn) {
            setTimeout(setupVoiceSearch, 500);
            return;
        }

        voiceBtn.addEventListener('click', function(e) {
            e.stopPropagation();

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showMessage('❌ المتصفح لا يدعم الصوت');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '⏺️';
                showMessage('🎤 استمع... تحدث الآن');
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                if (transcript) {
                    voiceBtn.classList.remove('recording');
                    voiceBtn.innerHTML = '🎤';
                    window.runSmartCommand(transcript);
                }
            };

            recognition.onerror = function() {
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '🎤';
                showMessage('❌ فشل التعرف الصوتي');
            };

            recognition.onend = function() {
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '🎤';
            };

            recognition.start();
        });

        console.log('✅ البحث الصوتي جاهز');
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(connectSearch, 2000);
            setTimeout(setupVoiceSearch, 2500);
        });
    } else {
        setTimeout(connectSearch, 2000);
        setTimeout(setupVoiceSearch, 2500);
    }

    console.log('✅ نظام الأوامر المتكامل مع الأزرار والبحث المتطور جاهز!');
    console.log('📋 الأزرار المدعومة:');
    console.log('   📊 تقرير, 🔄 تحديث, 🤖 ذكاء, 📈 رسوم, 🚪 خروج');
    console.log('   🎨 طبيعي, ليلي, داكن, طليعي');
    console.log('   💾 توفير, ⚡ سريع, 💬 رسائل, 💰 مديونيات');
    console.log('   🧠 ذاكرة, 👨‍💼 مدير, 🔄 مزامنة');
    console.log('🔍 البحث يدعم: اسم, رقم عداد, تشابه, ثلاثي');
    console.log('💡 اكتب أي حرف وستظهر اقتراحات ذكية');

})();

(function() {

    function startObserver() {
