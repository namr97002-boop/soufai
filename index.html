    </script>
<script>
//  نظام إرسال الرسائل - نسخة فائقة السرعة مع إصلاح الأزرار
// ============================================================

(function() {
    'use strict';
    
    // ============================================================
    //  المتغيرات العامة
    // ============================================================
    
    const CONFIG = {
        BUTTON_SIZE: 28,
        BUTTON_COLOR: '#25D366',
        DEBOUNCE_DELAY: 30,
        CACHE_EXPIRY: 15000,
        TOAST_DURATION: 1500,
        MAX_RETRIES: 2
    };
    
    let state = {
        cache: new Map(),
        month: null,
        isProcessing: false,
        initialized: false,
        retryCount: 0,
        renderTimeout: null
    };
    
    // ============================================================
    //  نظام الجلب الذكي للشهر
    // ============================================================
    
    class MonthDetector {
        constructor() {
            this.cachedMonth = null;
        }
        
        detect() {
            if (this.cachedMonth) return this.cachedMonth;
            if (state.month) return state.month;
            
            // محاولة الحصول على الشهر من مصادر مختلفة
            const sources = [
                this.fromSelects.bind(this),
                this.fromText.bind(this),
                this.fromElements.bind(this),
                this.fromStorage.bind(this),
                this.fromWindow.bind(this),
                this.fromTitle.bind(this),
                this.fromTableHeaders.bind(this),
                this.fromURL.bind(this),
                this.fromDate.bind(this)
            ];
            
            for (const source of sources) {
                const result = source();
                if (result) {
                    this.cachedMonth = result;
                    state.month = result;
                    return result;
                }
            }
            
            const fallback = (new Date().getMonth() + 1).toString();
            this.cachedMonth = fallback;
            state.month = fallback;
            return fallback;
        }
        
        fromSelects() {
            const selects = document.querySelectorAll('select');
            for (let i = 0; i < selects.length; i++) {
                const text = selects[i].value || selects[i].textContent || '';
                const match = text.match(/شهر\s*(\d+)/);
                if (match) return match[1];
            }
            return null;
        }
        
        fromText() {
            const text = document.body.textContent || '';
            const matches = text.match(/شهر\s*(\d+)/g);
            if (matches && matches.length > 0) {
                const last = matches[matches.length - 1];
                const match = last.match(/\d+/);
                return match ? match[0] : null;
            }
            return null;
        }
        
        fromElements() {
            const elements = document.querySelectorAll('[class*="month" i], [id*="month" i], [data-month]');
            for (let i = 0; i < elements.length; i++) {
                const text = elements[i].textContent || elements[i].value || elements[i].dataset.month || '';
                const match = text.match(/\d+/);
                if (match) return match[0];
            }
            return null;
        }
        
        fromStorage() {
            const storages = [localStorage, sessionStorage];
            const keys = ['currentMonth', 'month', 'selectedMonth', 'monthNumber'];
            
            for (let s = 0; s < storages.length; s++) {
                try {
                    for (let k = 0; k < keys.length; k++) {
                        const value = storages[s].getItem(keys[k]);
                        if (value) {
                            const match = value.match(/\d+/);
                            if (match) return match[0];
                        }
                    }
                } catch(e) {}
            }
            return null;
        }
        
        fromWindow() {
            const keys = ['__currentMonth', 'month', 'selectedMonth', 'currentMonth'];
            for (let i = 0; i < keys.length; i++) {
                if (window[keys[i]]) {
                    const value = window[keys[i]].toString();
                    const match = value.match(/\d+/);
                    if (match) return match[0];
                }
            }
            return null;
        }
        
        fromTitle() {
            const match = document.title.match(/\d+/);
            return match ? match[0] : null;
        }
        
        fromTableHeaders() {
            const headers = document.querySelectorAll('th, caption, thead td');
            for (let i = 0; i < headers.length; i++) {
                const match = headers[i].textContent.match(/شهر\s*(\d+)/);
                if (match) return match[1];
            }
            return null;
        }
        
        fromURL() {
            const match = window.location.href.match(/[?&]month=(\d+)/);
            return match ? match[1] : null;
        }
        
        fromDate() {
            return (new Date().getMonth() + 1).toString();
        }
    }
    
    // ============================================================
    //  نظام إدارة البيانات
    // ============================================================
    
    class DataManager {
        constructor() {
            this.monthDetector = new MonthDetector();
        }
        
        getMonth() {
            return this.monthDetector.detect();
        }
        
        extractRowData(row) {
            const cells = row.querySelectorAll('td');
            if (cells.length < 13) return null;
            
            const getText = (cell) => {
                if (!cell) return '';
                return cell.textContent.trim();
            };
            
            return {
                phone: getText(cells[0]),
                previous: getText(cells[2]) || '0',
                current: getText(cells[3]) || '0',
                value: getText(cells[6]) || '0',
                subscription: getText(cells[7]) || '0',
                total: getText(cells[9]) || '0',
                paid: getText(cells[11]) || '0',
                remaining: getText(cells[12]) || '0',
                month: this.getMonth()
            };
        }
        
        getRowData(rowIndex) {
            // من الكاش
            if (state.cache.has(rowIndex)) {
                const cached = state.cache.get(rowIndex);
                if (Date.now() - cached.timestamp < CONFIG.CACHE_EXPIRY) {
                    return cached.data;
                }
            }
            
            const tableWrapper = document.getElementById('tableWrapper');
            if (!tableWrapper) return null;
            
            const rows = tableWrapper.querySelectorAll('tbody tr');
            if (rowIndex >= rows.length) return null;
            
            const data = this.extractRowData(rows[rowIndex]);
            if (data) {
                state.cache.set(rowIndex, {
                    data: data,
                    timestamp: Date.now()
                });
            }
            return data;
        }
        
        getAllRows() {
            const tableWrapper = document.getElementById('tableWrapper');
            if (!tableWrapper) return [];
            
            const rows = tableWrapper.querySelectorAll('tbody tr');
            const result = [];
            const month = this.getMonth();
            const totalRows = rows.length;
            
            // استثناء الصف الأخير فقط
            for (let i = 0; i < totalRows - 1; i++) {
                const data = this.extractRowData(rows[i]);
                if (data) {
                    data.month = month;
                    result.push({ index: i, data, row: rows[i] });
                }
            }
            
            return result;
        }
    }
    
    // ============================================================
    //  نظام واجهة المستخدم
    // ============================================================
    
    class UIManager {
        constructor(dataManager) {
            this.dataManager = dataManager;
            this.toastTimer = null;
        }
        
        createButton(index) {
            const btn = document.createElement('button');
            btn.className = 'send-btn-added';
            btn.innerHTML = '💬';
            btn.title = 'إرسال رسالة';
            btn.setAttribute('data-index', index);
            
            btn.style.cssText = `
                background: ${CONFIG.BUTTON_COLOR};
                border: none;
                color: white;
                border-radius: 50%;
                width: ${CONFIG.BUTTON_SIZE}px;
                height: ${CONFIG.BUTTON_SIZE}px;
                cursor: pointer;
                font-size: 14px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-left: 6px;
                flex-shrink: 0;
                vertical-align: middle;
                box-shadow: 0 2px 8px rgba(37,211,102,0.4);
                transition: all 0.15s ease;
            `;
            
            // أحداث الـ Hover
            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.1)';
                this.style.boxShadow = '0 4px 16px rgba(37,211,102,0.6)';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 2px 8px rgba(37,211,102,0.4)';
            });
            
            // حدث النقر - الأهم
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                const idx = parseInt(this.getAttribute('data-index'));
                console.log('🔘 تم النقر على الزر رقم:', idx);
                window.sendSMSOptimized(idx);
            });
            
            return btn;
        }
        
        renderButtons() {
            // إلغاء أي عملية تقديم معلقة
            if (state.renderTimeout) {
                clearTimeout(state.renderTimeout);
                state.renderTimeout = null;
            }
            
            // حذف الأزرار القديمة
            const oldButtons = document.querySelectorAll('.send-btn-added');
            for (let i = 0; i < oldButtons.length; i++) {
                oldButtons[i].remove();
            }
            
            const rows = this.dataManager.getAllRows();
            if (rows.length === 0) {
                if (state.retryCount < CONFIG.MAX_RETRIES) {
                    state.retryCount++;
                    state.renderTimeout = setTimeout(() => this.renderButtons(), CONFIG.DEBOUNCE_DELAY * 2);
                }
                return;
            }
            
            state.retryCount = 0;
            
            // تخزين البيانات في الكاش
            for (let i = 0; i < rows.length; i++) {
                const { index, data } = rows[i];
                state.cache.set(index, {
                    data: data,
                    timestamp: Date.now()
                });
            }
            
            // إضافة الأزرار
            let addedCount = 0;
            for (let i = 0; i < rows.length; i++) {
                const { index, row } = rows[i];
                const cells = row.querySelectorAll('td');
                if (cells.length < 2) continue;
                
                const meterCell = cells[0];
                if (!meterCell || meterCell.querySelector('.send-btn-added')) continue;
                
                const btn = this.createButton(index);
                meterCell.insertBefore(btn, meterCell.firstChild);
                addedCount++;
            }
            
            console.log(`✅ تم إضافة ${addedCount} زر إرسال`);
            state.initialized = true;
        }
        
        showToast(message, type = 'success') {
            const oldToast = document.querySelector('.custom-toast');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.textContent = message;
            
            const colors = {
                success: '#25D366',
                error: '#FF4444',
                info: '#2196F3',
                warning: '#FF9800'
            };
            
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${colors[type] || colors.success};
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 13px;
                z-index: 9999;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
                animation: slideInRight 0.25s ease;
                font-family: Arial, sans-serif;
                direction: rtl;
                opacity: 1;
            `;
            
            document.body.appendChild(toast);
            
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.25s';
                setTimeout(() => toast.remove(), 250);
            }, CONFIG.TOAST_DURATION);
        }
        
        showError(message) {
            this.showToast('❌ ' + message, 'error');
        }
        
        showSuccess(message) {
            this.showToast('✅ ' + message, 'success');
        }
    }
    
    // ============================================================
    //  النظام الرئيسي
    // ============================================================
    
    class SMSManager {
        constructor() {
            this.dataManager = new DataManager();
            this.uiManager = new UIManager(this.dataManager);
            this.updateTimer = null;
        }
        
        init() {
            // تأكد من وجود الجدول
            const checkTable = () => {
                const tableWrapper = document.getElementById('tableWrapper');
                if (tableWrapper) {
                    requestAnimationFrame(() => {
                        this.uiManager.renderButtons();
                    });
                } else {
                    setTimeout(checkTable, 100);
                }
            };
            
            checkTable();
            
            // مراقبة التغييرات
            const observer = new MutationObserver((mutations) => {
                let shouldUpdate = false;
                for (let i = 0; i < mutations.length; i++) {
                    if (mutations[i].type === 'childList' && mutations[i].addedNodes.length > 0) {
                        shouldUpdate = true;
                        break;
                    }
                }
                
                if (shouldUpdate) {
                    clearTimeout(this.updateTimer);
                    this.updateTimer = setTimeout(() => {
                        requestAnimationFrame(() => {
                            this.uiManager.renderButtons();
                        });
                    }, CONFIG.DEBOUNCE_DELAY);
                }
            });
            
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
            
            console.log('🚀 نظام الإرسال جاهز - يستثني الصف الأخير فقط');
        }
        
        send(rowIndex) {
            console.log('📤 محاولة إرسال للصف:', rowIndex);
            
            if (state.isProcessing) {
                this.uiManager.showToast('⏳ جاري المعالجة...', 'warning');
                return;
            }
            
            state.isProcessing = true;
            
            try {
                const data = this.dataManager.getRowData(rowIndex);
                console.log('📊 البيانات المستخرجة:', data);
                
                if (!data) {
                    this.uiManager.showError('البيانات غير مكتملة');
                    state.isProcessing = false;
                    return;
                }
                
                // التحقق من وجود رقم هاتف
                if (!data.phone || data.phone.trim() === '') {
                    this.uiManager.showError('رقم الهاتف غير موجود');
                    state.isProcessing = false;
                    return;
                }
                
                const diff = parseFloat(data.current) - parseFloat(data.previous);
                const remainingNum = parseFloat(data.remaining);
                const warning = remainingNum >= 5000 ? ' ⚠️ إنذار بالفصل' : '';
                
                const message = `فاتورة شهر ${data.month}: سابقة: ${data.previous}, الحالية: ${data.current}, الفارق: ${diff}, القيمة: ${data.value}, الاشتراك: ${data.subscription}, المجموع: ${data.total}, المسلم: ${data.paid}, المتبقي: ${data.remaining}${warning}`;
                
                console.log('📝 الرسالة:', message);
                
                let phone = data.phone.toString().trim().replace(/\s/g, '');
                if (phone.startsWith('0')) phone = phone.substring(1);
                if (phone.length === 9 && phone.startsWith('7')) {
                    phone = '+967' + phone;
                }
                
                console.log('📱 رقم الهاتف بعد التنسيق:', phone);
                
                if (phone.length >= 9) {
                    const smsUrl = `sms:${phone}?body=${encodeURIComponent(message)}`;
                    console.log('🔗 فتح الرابط:', smsUrl);
                    window.location.href = smsUrl;
                    this.uiManager.showSuccess('تم فتح تطبيق الرسائل');
                } else {
                    // نسخ الرسالة للحافظة
                    navigator.clipboard.writeText(message).then(() => {
                        this.uiManager.showSuccess('تم نسخ الرسالة');
                    }).catch(() => {
                        // طريقة بديلة للنسخ
                        const textarea = document.createElement('textarea');
                        textarea.value = message;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        textarea.remove();
                        this.uiManager.showSuccess('تم نسخ الرسالة');
                    });
                }
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                this.uiManager.showError(error.message || 'حدث خطأ غير متوقع');
            }
            
            setTimeout(() => {
                state.isProcessing = false;
            }, 300);
        }
    }
    
    // ============================================================
    //  إضافة أنماط CSS المتحركة
    // ============================================================
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);

        .send-btn-added {
            position: relative;
            z-index: 1;
        }
        
        .send-btn-added:active {
            transform: scale(0.9) !important;
        }
    `;
    document.head.appendChild(style);
    
    // ============================================================
    //  تشغيل النظام
    // ============================================================
    
    const smsManager = new SMSManager();
    
    // تعريف الدوال العالمية
    window.sendSMSOptimized = function(index) {
        console.log('🌐 تم استدعاء sendSMSOptimized من العام:', index);
        smsManager.send(index);
    };
    
    window.initSendButtons = function() {
        smsManager.uiManager.renderButtons();

    window.getMonth = function() {

    // بدء التشغيل

    console.log('✅ تم تحميل نظام الإرسال - الأزرار تعمل الآن');

})();

// ================================================================
//  🧠 Soufai Memory Manager v4.0 - زر ثابت في أعلى يسار
//  📍 موقع ثابت | 🚫 غير متحرك | 🔒 يظهر بعد الدخول
// ================================================================

(function() {
    'use strict';

    // ============================================================
    //  الإعدادات المتقدمة
    // ============================================================
    const MEMORY_CONFIG = {
        CACHE_KEY: 'soufai_memory_v4',
        BACKUP_KEY: 'soufai_backup_v4',
        MAX_CACHE_ITEMS: 200,
        MAX_CACHE_AGE: 60 * 60 * 1000,
        COMPRESSION_ENABLED: true,
        AUTO_CLEANUP_INTERVAL: 2 * 60 * 1000,
        MAX_STORAGE_SIZE: 10 * 1024 * 1024,
        DEBOUNCE_DELAY: 300,
        VALIDATION_ENABLED: true
    };

    // ============================================================
    //  أدوات مساعدة
    // ============================================================
    const Utils = {
        generateId: () => Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
        
        formatSize: (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },
        
        getTotalStorageSize: () => {
            let total = 0;
            try {
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length * 2;
                    }
                }
            } catch(e) {}
            return total;
        },
        
        getStorageLimit: () => {
            try {
                const test = 'a'.repeat(1024 * 1024 * 10);
                localStorage.setItem('_test_', test);
                localStorage.removeItem('_test_');
                return 10 * 1024 * 1024;
            } catch(e) {
                return 5 * 1024 * 1024;
            }
        },
        
        validateData: (data) => {
            if (data === null || data === undefined) return false;
            if (typeof data === 'string' && data.trim() === '') return false;
            if (Array.isArray(data) && data.length === 0) return false;
            if (typeof data === 'object' && Object.keys(data).length === 0) return false;
            return true;
        },
        
        deepClone: (obj) => {
            if (obj === null || typeof obj !== 'object') return obj;
            if (obj instanceof Date) return new Date(obj);
            if (obj instanceof RegExp) return new RegExp(obj);
            if (Array.isArray(obj)) return obj.map(item => Utils.deepClone(item));
            const cloned = {};
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    cloned[key] = Utils.deepClone(obj[key]);
                }
            }
            return cloned;
        },
        
        getSize: (data) => {
            try {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                return new Blob([str]).size;
            } catch {
                return 0;
            }
        }
    };

    // ============================================================
    //  ضاغط محسن
    // ============================================================
    class AdvancedCompressor {
        static compress(data) {
            if (!MEMORY_CONFIG.COMPRESSION_ENABLED) return data;
            try {
                const json = typeof data === 'string' ? data : JSON.stringify(data);
                return json.replace(/\s+/g, ' ').replace(/\n/g, '');
            } catch {
                return data;
            }
        }

        static decompress(data) {
            try {
                if (typeof data === 'string') {
                    return JSON.parse(data);
                }
                return data;
            } catch {
                return data;
            }
        }
    }

    // ============================================================
    //  نظام التخزين المؤقت المتقدم
    // ============================================================
    class SmartCache {
        constructor() {
            this.data = new Map();
            this.metadata = {
                created: Date.now(),
                hits: 0,
                misses: 0,
                evictions: 0,
                totalSize: 0,
                lastCleanup: Date.now()
            };
            this.pendingWrites = new Map();
            this.isWriting = false;
            this.loadFromStorage();
            this.startAutoCleanup();
            this.setupBeforeUnload();
        }

        setupBeforeUnload() {
            window.addEventListener('beforeunload', () => {
                if (this.pendingWrites.size > 0) this.saveToStorage();
            });
        }

        set(key, value, ttl = MEMORY_CONFIG.MAX_CACHE_AGE) {
            if (!key || typeof key !== 'string') return false;
            if (MEMORY_CONFIG.VALIDATION_ENABLED && !Utils.validateData(value)) return false;

            if (this.data.size >= MEMORY_CONFIG.MAX_CACHE_ITEMS) {
                this.evictLRU();
                this.metadata.evictions++;
            }

            const deepCopy = Utils.deepClone(value);
            const compressed = AdvancedCompressor.compress(deepCopy);

            const item = {
                value: compressed,
                timestamp: Date.now(),
                expires: Date.now() + ttl,
                size: Utils.getSize(compressed),
                accessCount: 0,
                lastAccessed: Date.now(),
                id: Utils.generateId()
            };

            this.data.set(key, item);
            this.updateMetadata();
            this.scheduleWrite(key);
            return true;
        }

        get(key) {
            if (!key || typeof key !== 'string') {
                this.metadata.misses++;
                return null;
            }

            const item = this.data.get(key);
            if (!item) {
                this.metadata.misses++;
                return null;
            }

            if (Date.now() > item.expires) {
                this.data.delete(key);
                this.metadata.misses++;
                this.scheduleWrite();
                return null;
            }

            item.accessCount = (item.accessCount || 0) + 1;
            item.lastAccessed = Date.now();
            this.metadata.hits++;
            this.updateMetadata();

            try {
                return AdvancedCompressor.decompress(item.value);
            } catch {
                return null;
            }
        }

        delete(key) {
            if (!key || typeof key !== 'string') return false;
            const deleted = this.data.delete(key);
            if (deleted) {
                this.updateMetadata();
                this.scheduleWrite();
            }
            return deleted;
        }

        clear() {
            this.data.clear();
            this.metadata.hits = 0;
            this.metadata.misses = 0;
            this.metadata.evictions = 0;
            this.updateMetadata();
            this.saveToStorage();
            this.showStatus('🧹 تم تنظيف الذاكرة بالكامل', 'success');
        }

        evictLRU() {
            let oldest = null;
            let oldestTime = Infinity;
            for (const [key, item] of this.data) {
                if (item.lastAccessed < oldestTime) {
                    oldestTime = item.lastAccessed;
                    oldest = key;
                }
            }
            if (oldest) {
                this.data.delete(oldest);
                this.metadata.evictions++;
                return true;
            }
            return false;
        }

        cleanup() {
            const now = Date.now();
            let count = 0;
            let sizeFreed = 0;

            for (const [key, item] of this.data) {
                if (now > item.expires) {
                    sizeFreed += item.size || 0;
                    this.data.delete(key);
                    count++;
                }
            }

            if (count > 0) {
                this.updateMetadata();
                this.scheduleWrite();
                this.showStatus(`🧹 تم تنظيف ${count} عناصر منتهية الصلاحية`, 'info');
            }

            this.metadata.lastCleanup = now;
            return { count, sizeFreed };
        }

        startAutoCleanup() {
            setInterval(() => this.cleanup(), MEMORY_CONFIG.AUTO_CLEANUP_INTERVAL);
        }

        scheduleWrite(key = null) {
            if (key) this.pendingWrites.set(key, Date.now());
            clearTimeout(this._writeTimeout);
            this._writeTimeout = setTimeout(() => this.saveToStorage(), MEMORY_CONFIG.DEBOUNCE_DELAY);
        }

        saveToStorage() {
            if (this.isWriting) return;
            this.isWriting = true;

            try {
                const data = {
                    entries: Array.from(this.data.entries()),
                    metadata: this.metadata,
                    version: '4.0',
                    timestamp: Date.now()
                };
                localStorage.setItem(MEMORY_CONFIG.CACHE_KEY, JSON.stringify(data));
                this.pendingWrites.clear();
            } catch (error) {
                if (error.name === 'QuotaExceededError') this.handleQuotaExceeded();
                console.warn('⚠️ فشل حفظ الكاش:', error.message);
            }
            this.isWriting = false;
        }

        handleQuotaExceeded() {
            this.showStatus('⚠️ مساحة التخزين ممتلئة، جاري التنظيف...', 'error');
            const items = Array.from(this.data.entries()).sort((a, b) => (b[1].size || 0) - (a[1].size || 0));
            const toDelete = Math.ceil(items.length * 0.4);
            for (let i = 0; i < toDelete && i < items.length; i++) {
                this.data.delete(items[i][0]);
            }
            this.updateMetadata();
            this.saveToStorage();
        }

        loadFromStorage() {
            try {
                const saved = localStorage.getItem(MEMORY_CONFIG.CACHE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.entries) {
                        this.data = new Map(data.entries);
                        this.metadata = data.metadata || this.metadata;
                    }
                }
            } catch (error) {
                console.warn('⚠️ فشل تحميل الكاش:', error.message);
            }
        }

        updateMetadata() {
            let totalSize = 0;
            for (const [, item] of this.data) {
                totalSize += item.size || 0;
            }
            this.metadata.totalSize = totalSize;
            this.metadata.itemCount = this.data.size;
            this.metadata.avgSize = this.data.size > 0 ? totalSize / this.data.size : 0;
        }

        showStatus(message, type = 'info') {
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[SmartCache] ${type}: ${message}`);
            }
        }

        getStats() {
            const total = this.metadata.hits + this.metadata.misses;
            const hitRate = total > 0 ? Math.round((this.metadata.hits / total) * 100) : 0;
            const totalStorage = Utils.getTotalStorageSize();
            const storageLimit = Utils.getStorageLimit();

            return {
                items: this.data.size,
                maxItems: MEMORY_CONFIG.MAX_CACHE_ITEMS,
                hits: this.metadata.hits,
                misses: this.metadata.misses,
                evictions: this.metadata.evictions,
                hitRate: hitRate,
                totalSize: this.metadata.totalSize,
                sizeFormatted: Utils.formatSize(this.metadata.totalSize),
                avgSize: Utils.formatSize(this.metadata.avgSize || 0),
                lastCleanup: new Date(this.metadata.lastCleanup).toLocaleString('ar-SA'),
                created: new Date(this.metadata.created).toLocaleString('ar-SA'),
                pendingWrites: this.pendingWrites.size,
                isWriting: this.isWriting,
                utilization: Math.round((this.data.size / MEMORY_CONFIG.MAX_CACHE_ITEMS) * 100),
                totalStorage: totalStorage,
                totalStorageFormatted: Utils.formatSize(totalStorage),
                storageLimit: storageLimit,
                storageLimitFormatted: Utils.formatSize(storageLimit),
                storageRemaining: storageLimit - totalStorage,
                storageRemainingFormatted: Utils.formatSize(Math.max(0, storageLimit - totalStorage)),
                storageUsagePercent: storageLimit > 0 ? Math.round((totalStorage / storageLimit) * 100) : 0
            };
        }
    }

    // ============================================================
    //  نظام النسخ الاحتياطي
    // ============================================================
    class AdvancedBackup {
        constructor() {
            this.key = MEMORY_CONFIG.BACKUP_KEY;
            this.backup = null;
            this.load();
        }

        create(data, options = {}) {
            const { label = 'النسخة الاحتياطية', type = 'manual', metadata = {} } = options;
            if (!data) {
                this.showStatus('❌ لا توجد بيانات للنسخ الاحتياطي', 'error');
                return null;
            }

            const cleanData = Utils.deepClone(data);
            const compressed = AdvancedCompressor.compress(cleanData);
            const size = Utils.getSize(compressed);

            const backup = {
                id: Utils.generateId(),
                version: '4.0',
                timestamp: Date.now(),
                date: new Date().toLocaleString('ar-SA'),
                label: label,
                type: type,
                size: size,
                sizeFormatted: Utils.formatSize(size),
                data: compressed,
                metadata: {
                    ...metadata,
                    itemCount: Array.isArray(data) ? data.length : (data ? Object.keys(data).length : 0),
                    compressed: MEMORY_CONFIG.COMPRESSION_ENABLED,
                    checksum: this.generateChecksum(compressed)
                }
            };

            this.backup = backup;
            this.save();
            this.showStatus(`💾 تم حفظ نسخة احتياطية جديدة (استبدلت القديمة)`, 'success');
            return backup;
        }

        restore() {
            if (!this.backup) {

        save() {

                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;

                return hash.toString(16);
            } catch {

        }

        }
    }

// ================================================================
//  🧠 Soufai Memory Manager v5.0 - الكود الكامل
//  ✅ النسخ التلقائي مسموح
//  ❌ النسخ اليدوي ممنوع
//  ✅ الزر يظهر في شريط الأزرار
//  ✅ ممنوع العمل من النسخة المحلية أثناء وجود النت
// ================================================================

(function() {
    'use strict';

    // ============================================================
    //  الإعدادات
    // ============================================================
    const MEMORY_CONFIG = {
        CACHE_KEY: 'soufai_memory_v4',
        MAX_CACHE_ITEMS: 100,
        MAX_CACHE_AGE: 30 * 60 * 1000,
        COMPRESSION_ENABLED: true,
        AUTO_CLEANUP_INTERVAL: 5 * 60 * 1000,
        VALIDATION_ENABLED: true
    };

    // ============================================================
    //  أدوات مساعدة
    // ============================================================
    const Utils = {
        generateId: () => Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
        
        formatSize: (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },
        
        getTotalStorageSize: () => {
            let total = 0;
            try {
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length * 2;
                    }
                }
            } catch(e) {}
            return total;
        },
        
        getStorageLimit: () => {
            try {
                const test = 'a'.repeat(1024 * 1024 * 10);
                localStorage.setItem('_test_', test);
                localStorage.removeItem('_test_');
                return 10 * 1024 * 1024;
            } catch(e) {
                return 5 * 1024 * 1024;
            }
        },
        
        deepClone: (obj) => {
            if (obj === null || typeof obj !== 'object') return obj;
            if (obj instanceof Date) return new Date(obj);
            if (Array.isArray(obj)) return obj.map(item => Utils.deepClone(item));
            const cloned = {};
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    cloned[key] = Utils.deepClone(obj[key]);
                }
            }
            return cloned;
        },
        
        getSize: (data) => {
            try {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                return new Blob([str]).size;
            } catch {
                return 0;
            }
        }
    };

    // ============================================================
    //  ضاغط
    // ============================================================
    class AdvancedCompressor {
        static compress(data) {
            if (!MEMORY_CONFIG.COMPRESSION_ENABLED) return data;
            try {
                const json = typeof data === 'string' ? data : JSON.stringify(data);
                return json.replace(/\s+/g, ' ').replace(/\n/g, '');
            } catch {
                return data;
            }
        }

        static decompress(data) {
            try {
                if (typeof data === 'string') {
                    return JSON.parse(data);
                }
                return data;
            } catch {
                return data;
            }
        }
    }

    // ============================================================
    //  نظام التخزين المؤقت
    // ============================================================
    class SmartCache {
        constructor() {
            this.data = new Map();
            this.metadata = {
                created: Date.now(),
                hits: 0,
                misses: 0,
                evictions: 0,
                totalSize: 0,
                lastCleanup: Date.now()
            };
            this.isWriting = false;
            this.loadFromStorage();
            this.startAutoCleanup();
        }

        set(key, value, ttl = MEMORY_CONFIG.MAX_CACHE_AGE) {
            if (!key || typeof key !== 'string') return false;

            if (this.data.size >= MEMORY_CONFIG.MAX_CACHE_ITEMS) {
                this.evictLRU();
                this.metadata.evictions++;
            }

            const deepCopy = Utils.deepClone(value);
            const compressed = AdvancedCompressor.compress(deepCopy);

            const item = {
                value: compressed,
                timestamp: Date.now(),
                expires: Date.now() + ttl,
                size: Utils.getSize(compressed),
                accessCount: 0,
                lastAccessed: Date.now(),
                id: Utils.generateId()
            };

            this.data.set(key, item);
            this.updateMetadata();
            this.saveToStorage();
            return true;
        }

        get(key) {
            if (!key || typeof key !== 'string') {
                this.metadata.misses++;
                return null;
            }

            // 🔥🔥🔥 ممنوع استخدام الكاش أثناء وجود النت 🔥🔥🔥
            if (navigator.onLine) {
                this.metadata.misses++;
                return null;
            }

            const item = this.data.get(key);
            if (!item) {
                this.metadata.misses++;
                return null;
            }

            if (Date.now() > item.expires) {
                this.data.delete(key);
                this.metadata.misses++;
                this.saveToStorage();
                return null;
            }

            item.accessCount = (item.accessCount || 0) + 1;
            item.lastAccessed = Date.now();
            this.metadata.hits++;
            this.updateMetadata();

            try {
                return AdvancedCompressor.decompress(item.value);
            } catch {
                return null;
            }
        }

        delete(key) {
            if (!key || typeof key !== 'string') return false;
            const deleted = this.data.delete(key);
            if (deleted) {
                this.updateMetadata();
                this.saveToStorage();
            }
            return deleted;
        }

        clear() {
            this.data.clear();
            this.metadata.hits = 0;
            this.metadata.misses = 0;
            this.metadata.evictions = 0;
            this.updateMetadata();
            this.saveToStorage();
            this.showStatus('🧹 تم تنظيف الكاش بالكامل', 'success');
        }

        evictLRU() {
            let oldest = null;
            let oldestTime = Infinity;
            for (const [key, item] of this.data) {
                if (item.lastAccessed < oldestTime) {
                    oldestTime = item.lastAccessed;
                    oldest = key;
                }
            }
            if (oldest) {
                this.data.delete(oldest);
                this.metadata.evictions++;
                return true;
            }
            return false;
        }

        cleanup() {
            const now = Date.now();
            let count = 0;
            let sizeFreed = 0;

            for (const [key, item] of this.data) {
                if (now > item.expires) {
                    sizeFreed += item.size || 0;
                    this.data.delete(key);
                    count++;
                }
            }

            if (count > 0) {
                this.updateMetadata();
                this.saveToStorage();
                this.showStatus(`🧹 تم تنظيف ${count} عناصر منتهية الصلاحية`, 'info');
            }

            this.metadata.lastCleanup = now;
            return { count, sizeFreed };
        }

        startAutoCleanup() {
            setInterval(() => this.cleanup(), MEMORY_CONFIG.AUTO_CLEANUP_INTERVAL);
        }

        saveToStorage() {
            if (this.isWriting) return;
            this.isWriting = true;

            try {
                const data = {
                    entries: Array.from(this.data.entries()),
                    metadata: this.metadata,
                    version: '5.0',
                    timestamp: Date.now()
                };
                localStorage.setItem(MEMORY_CONFIG.CACHE_KEY, JSON.stringify(data));
            } catch (error) {
                console.warn('⚠️ فشل حفظ الكاش:', error.message);
            }
            this.isWriting = false;
        }

        loadFromStorage() {
            try {
                const saved = localStorage.getItem(MEMORY_CONFIG.CACHE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.entries) {
                        this.data = new Map(data.entries);
                        this.metadata = data.metadata || this.metadata;
                    }
                }
            } catch (error) {
                console.warn('⚠️ فشل تحميل الكاش:', error.message);
            }
        }

        updateMetadata() {
            let totalSize = 0;
            for (const [, item] of this.data) {
                totalSize += item.size || 0;
            }
            this.metadata.totalSize = totalSize;
            this.metadata.itemCount = this.data.size;
            this.metadata.avgSize = this.data.size > 0 ? totalSize / this.data.size : 0;
        }

        showStatus(message, type = 'info') {
            if (window.showSyncIndicator) {
                window.showSyncIndicator(message, type);
            } else {
                console.log(`[Cache] ${type}: ${message}`);
            }
        }

        getStats() {
            const total = this.metadata.hits + this.metadata.misses;
            const hitRate = total > 0 ? Math.round((this.metadata.hits / total) * 100) : 0;
            const totalStorage = Utils.getTotalStorageSize();
            const storageLimit = Utils.getStorageLimit();

            return {
                items: this.data.size,
                maxItems: MEMORY_CONFIG.MAX_CACHE_ITEMS,
                hits: this.metadata.hits,
                misses: this.metadata.misses,
                evictions: this.metadata.evictions,
                hitRate: hitRate,
                totalSize: this.metadata.totalSize,
                sizeFormatted: Utils.formatSize(this.metadata.totalSize),
                avgSize: Utils.formatSize(this.metadata.avgSize || 0),
                lastCleanup: new Date(this.metadata.lastCleanup).toLocaleString('ar-SA'),
                created: new Date(this.metadata.created).toLocaleString('ar-SA'),
                utilization: Math.round((this.data.size / MEMORY_CONFIG.MAX_CACHE_ITEMS) * 100),
                totalStorage: totalStorage,
                totalStorageFormatted: Utils.formatSize(totalStorage),
                storageLimit: storageLimit,
                storageLimitFormatted: Utils.formatSize(storageLimit),
                storageRemaining: storageLimit - totalStorage,
                storageRemainingFormatted: Utils.formatSize(Math.max(0, storageLimit - totalStorage)),
                storageUsagePercent: storageLimit > 0 ? Math.round((totalStorage / storageLimit) * 100) : 0
            };
        }
    }

// ===== تمييز الصف عند النقر على الاسم - تغيير اللون بالكامل =====
(function() {
    'use strict';

    function handleClick(e) {
        var td = e.target.closest('td');
        if (!td) return;

        var tr = td.closest('tr');
        if (!tr) return;

        // تجاهل الصفوف الخاصة
        if (tr.classList.contains('row-0') || 
            tr.classList.contains('row-1') || 
            tr.classList.contains('total-row')) {
            return;
        }

        // معرفة رقم العمود
        var cells = tr.querySelectorAll('td');
        var colIndex = -1;
        for (var i = 0; i < cells.length; i++) {
            if (cells[i] === td) {
                colIndex = i;
                break;
            }
        }

        // فقط العمود الثاني (الاسم)
        if (colIndex !== 1) return;

        // إذا كانت الخلية قابلة للتعديل ولا نريد التداخل
        if (td.classList.contains('editable') && td.isContentEditable) return;

        // إزالة التحديد من جميع الصفوف
        document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
            row.classList.remove('selected-row');
        });

        // تمييز الصف المحدد
        tr.classList.add('selected-row');
        tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function init() {
        var table = document.getElementById('tableWrapper');
        if (!table) {
            setTimeout(init, 300);
            return;
        }
        table.removeEventListener('click', handleClick);
        table.addEventListener('click', handleClick);
        console.log('✅ تم تفعيل تمييز الصف - تغيير اللون بالكامل');
    }

    // دوال عامة
    window.clearRowHighlight = function() {
        document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
            row.classList.remove('selected-row');
        });
    };

    window.highlightRow = function(index) {
        var rows = document.querySelectorAll('#tableWrapper tbody tr');
        if (rows[index]) {
            document.querySelectorAll('#tableWrapper tbody tr.selected-row').forEach(function(row) {
                row.classList.remove('selected-row');
            });
            rows[index].classList.add('selected-row');
            rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // مراقبة التغييرات
    var observer = new MutationObserver(function() {
        var table = document.getElementById('tableWrapper');
        if (table) {
            init();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
<!-- ===== تحديث الساعة والتاريخ الهجري في شاشة الدخول ===== -->
<script>
(function() {
    'use strict';

    // ============================================================
    //  دالة تحويل التاريخ الميلادي إلى هجري
    // ============================================================
    function toHijri(date) {
        const g = date.getDate();
        const m = date.getMonth() + 1;
        const y = date.getFullYear();

        let jd = Math.floor((1461 * (y + 4800 + Math.floor((m - 14) / 12))) / 4) +
                 Math.floor((367 * (m - 2 - 12 * Math.floor((m - 14) / 12))) / 12) -
                 Math.floor((3 * Math.floor((y + 4900 + Math.floor((m - 14) / 12)) / 100)) / 4) +
                 g - 32075;

        let l = jd - 1948440 + 10632;
        let n = Math.floor((l - 1) / 10631);
        l = l - 10631 * n + 354;
        let j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) +
                (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
        l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) -
            (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
        let month = Math.floor((24 * l) / 709);
        let day = l - Math.floor((709 * month) / 24);
        let year = 30 * n + j - 30;

        const hijriMonths = ['محرم', 'صفر', 'ربيع الأول', 'ربيع الثاني', 'جمادى الأولى', 'جمادى الآخرة',
            'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة'
        ];

        return day + ' ' + hijriMonths[month - 1] + ' ' + year + ' هـ';
    }

    // ============================================================
    //  تحديث الساعة والتاريخ (نظام 12 ساعة)
    // ============================================================
    function updateClock() {
        const now = new Date();

        // ===== الساعة بنظام 12 ساعة مع AM/PM بالعربية =====
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'م' : 'ص';
        hours = hours % 12;
        hours = hours ? hours : 12;  // 12 بدلاً من 0
        const h = String(hours).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const timeString = h + ':' + m + ':' + s + ' ' + ampm;

        // التاريخ الميلادي
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
            'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
        ];
        const dateString = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
        const dayString = days[now.getDay()];

        // التاريخ الهجري
        const hijriString = toHijri(now);

        // تحديث العناصر
        const clockEl = document.getElementById('clockDisplay');
        const dateEl = document.getElementById('dateDisplay');
        const dayEl = document.getElementById('dayDisplay');
        const hijriEl = document.getElementById('hijriDisplay');

        if (clockEl) clockEl.textContent = timeString;
        if (dateEl) dateEl.textContent = dateString;
        if (dayEl) dayEl.textContent = dayString;
        if (hijriEl) hijriEl.textContent = hijriString;
    }

    // تحديث كل ثانية
    updateClock();
    setInterval(updateClock, 1000);

    console.log('✅ تم تفعيل الساعة بنظام 12 ساعة والتاريخ الهجري');
})();
</script>

                    remaining: remaining,
                    date: date,

                });

    // ============================================================
    //  ربط الزر بالدالة - ينتظر حتى يصبح الزر موجوداً
    // ============================================================

    function patchDebtButton() {
        // البحث عن زر المديونيات
        const debtBtn = document.querySelector('[title="المديونيات العالية (5000+)"]');
        if (debtBtn) {
            // التأكد من أن الزر ليس مربوطاً بالفعل
            if (debtBtn.dataset.patched === 'true') return;
            
            // إزالة الحدث القديم وإضافة الحدث الجديد
            const newBtn = debtBtn.cloneNode(true);
            debtBtn.parentNode.replaceChild(newBtn, debtBtn);
            
            newBtn.dataset.patched = 'true';
            newBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                // التحقق من وجود بيانات قبل التنفيذ
                const table = document.querySelector('#tableWrapper table');
                if (!table) {
                    alert('⚠️ الرجاء تسجيل الدخول أولاً ثم تحميل البيانات');
                    return;
                }
                window.fetchHighDebtSubscribers();
            });
            
            console.log('✅ تم إصلاح زر المديونيات');
            isReady = true;
            return true;
        }
        return false;
    }

    // ============================================================
    //  محاولة متكررة للعثور على الزر (حتى بعد تسجيل الدخول)
    // ============================================================

    function waitForButton() {
        if (patchDebtButton()) {
            console.log('✅ زر المديونيات جاهز للعمل');
            return;
        }
        
        retryCount++;
        if (retryCount < MAX_RETRIES) {
            console.log(`⏳ جاري انتظار زر المديونيات... (${retryCount}/${MAX_RETRIES})`);
            setTimeout(waitForButton, 1000);
        } else {
            console.warn('⚠️ لم يتم العثور على زر المديونيات بعد عدة محاولات');
        }
    }

    // ============================================================
    //  مراقبة التغييرات في DOM
    // ============================================================

    function startObserver() {
        const observer = new MutationObserver(function(mutations) {
            for (const mutation of mutations) {
                if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                    // التحقق من وجود زر المديونيات
                    const btn = document.querySelector('[title="المديونيات العالية (5000+)"]');
                    if (btn && !btn.dataset.patched) {
                        patchDebtButton();
                        console.log('✅ تم اكتشاف زر المديونيات وتصليحه');
                    }
                }
            }
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        console.log('👀 جاري مراقبة الصفحة لاكتشاف زر المديونيات...');
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(waitForButton, 1000);
            startObserver();
        });
    } else {
        setTimeout(waitForButton, 1000);
        startObserver();
    }

    console.log('✅ نظام المديونيات العالية جاهز (ينتظر تسجيل الدخول)');

})();
</script>

    <script>
    (function() {
        'use strict';
        
        const banner = document.getElementById('pwaInstallBanner');
        const btn = document.getElementById('btnInstallPWA');
        let deferredPrompt = null;
        
        // ===== التحقق إذا كان التطبيق مثبتاً =====
        function isAppInstalled() {
            // 1- وضع ملء الشاشة (Android/Desktop)
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }
            // 2- iOS
            if (window.navigator.standalone === true) {
                return true;
            }
            // 3- تخزين محلي
            if (localStorage.getItem('soufai_app_installed') === 'true') {
                return true;
            }
            return false;
        }
        
        // ===== إخفاء البanner نهائياً =====
        function hideBannerPermanently() {
            if (banner) {
                banner.style.display = 'none';
                banner.style.opacity = '0';
                banner.style.pointerEvents = 'none';
            }
            localStorage.setItem('soufai_app_installed', 'true');
        }
        
        // ===== إظهار البanner =====
        function showBanner() {
            if (banner && !isAppInstalled()) {
                banner.style.display = 'flex';
                banner.style.opacity = '1';
                banner.style.pointerEvents = 'auto';
            }
        }
        
        // ===== حدث التثبيت =====
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            
            // إظهار البanner بعد 2 ثانية
            setTimeout(function() {
                if (!isAppInstalled()) {
                    showBanner();
                }
            }, 2000);
        });
        
        // ===== زر التثبيت =====
        if (btn) {
            btn.addEventListener('click', async function() {
                if (!deferredPrompt) {
                    // إذا لم يظهر حدث التثبيت، نعرض تعليمات يدوية
                    let msg = '📲 للتثبيت على الجوال:\n';
                    msg += '• Android: اضغط ⋮ > تثبيت التطبيق\n';
                    msg += '• iPhone: اضغط ⬆️ > إضافة للشاشة الرئيسية\n';
                    msg += '• الكمبيوتر: اضغط على أيقونة التثبيت في شريط العنوان';
                    alert(msg);
                    return;
                }
                
                deferredPrompt.prompt();
                
                const { outcome } = await deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    console.log('✅ تم تثبيت التطبيق');
                    hideBannerPermanently();
                } else {
                    console.log('❌ تم رفض التثبيت');
                    // نعيد ظهور البanner لاحقاً
                    setTimeout(showBanner, 60000); // بعد دقيقة
                }
                
                deferredPrompt = null;
            });
        }
        
        // ===== بعد التثبيت الناجح =====
        window.addEventListener('appinstalled', function() {
            console.log('🎉 تم تثبيت التطبيق بنجاح');
            hideBannerPermanently();
        });
        
        // ===== فحص فوري عند تحميل الصفحة =====
        if (isAppInstalled()) {
            hideBannerPermanently();
        } else {
            // ننتظر قليلاً ثم نفحص مجدداً
            setTimeout(function() {
                if (!isAppInstalled() && !deferredPrompt) {
                    // نعرض البanner إذا كان المتصفح يدعم التثبيت
                    showBanner();
                }
            }, 3000);
        }
        
        // ===== مراقبة تغيير وضع العرض =====
        window.matchMedia('(display-mode: standalone)').addEventListener('change', function(e) {
            if (e.matches) {
                hideBannerPermanently();
            }
        });
        
        console.log('✅ نظام تثبيت PWA جاهز - يظهر الزر قبل التثبيت ويختفي بعده');
        
        // ===== جعل الدالة عامة للاستخدام من أي مكان =====
        window.installApp = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
            } else {
                alert('📲 استخدم قائمة المتصفح > تثبيت التطبيق');
            }
        };
        
        window.hideInstallBanner = hideBannerPermanently;
        
    })();
    </script>
<script>
(function() {
    'use strict';
    
    // ===== تحميل Chart.js من عدة روابط بديلة =====
    function loadChartJS() {
        const urls = [
            'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js',
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
            'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
        ];
        
        let index = 0;
        
        function tryLoad() {
            if (index >= urls.length) {
                console.error('❌ فشل تحميل Chart.js من جميع الروابط');
                // showToast('❌ فشل تحميل مكتبة الرسوم البيانية', 'error'); // تم حذفه
                return;
            }
            
            const url = urls[index];
            console.log(`⏳ محاولة تحميل Chart.js من: ${url}`);
            
            const script = document.createElement('script');
            script.src = url;
            script.onload = function() {
                console.log('✅ تم تحميل Chart.js بنجاح من:', url);
                window.ChartLoaded = true;
                // showToast('✅ تم تحميل الرسوم البيانية بنجاح', 'success'); // تم حذفه
                setTimeout(() => {
                    const event = new CustomEvent('toggleCharts', { 
                        detail: { visible: true } 
                    });
                    document.dispatchEvent(event);
                }, 500);
            };
            script.onerror = function() {
                console.warn(`⚠️ فشل التحميل من: ${url}`);
                index++;
                tryLoad();
            };
            document.head.appendChild(script);
        }
        
        tryLoad();
    }
    
    // ===== دالة عرض رسالة (محذوفة بالكامل) =====
    // function showToast(message, type) { ... }
    
    // ===== إضافة أنماط CSS =====
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    `;
    document.head.appendChild(style);
    
    // ===== بدء التحميل =====
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadChartJS, 1000);
        });
    } else {
        setTimeout(loadChartJS, 1000);
    }
    
    // ===== مراقبة زر الرسوم (تم حذف التنبيه) =====
    document.addEventListener('click', function(e) {
        const target = e.target.closest('[title*="الرسوم"]') || 
                       e.target.closest('[title="عرض الرسوم"]');
        if (target) {
            if (!window.ChartLoaded) {
                // showToast('⏳ جاري تحميل مكتبة الرسوم...', 'info'); // تم حذفه

        const villages = ['السوفعي', 'العليا', 'السفلى', 'الشعابي', 'الجبل', 'حيزان', 'رقش', 'الضرفة'];
        for (const v of villages) {

                for (const opt of options) {

    // ============================================================

    function showToast(message, type) {
        const old = document.querySelector('.voice-toast');
        if (old) old.remove();

        const toast = document.createElement('div');
        toast.className = 'voice-toast';
        toast.textContent = message;
        toast.style.cssText = `
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: ${type === 'success' ? 'rgba(0, 176, 155, 0.95)' :

                         'rgba(0, 119, 182, 0.95)'};

            padding: 14px 28px;
            border-radius: 16px;

            text-align: center;
            max-width: 90%;
            animation: fadeInUp 0.3s ease;
            font-weight: bold;
        `;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.4s';
            setTimeout(() => toast.remove(), 400);
        }, 3500);
    }

    // ============================================================
    //  دالة بدء التسجيل الصوتي
    // ============================================================

    window.startVoiceSearch = function() {
        if (!SpeechRecognition) {
            showToast('❌ المتصفح لا يدعم البحث الصوتي', 'error');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 5;

        let timeoutId = null;

        recognition.onstart = function() {
            showToast('🎤 استمع... تحدث الآن', 'info');
            const voiceBtn = document.querySelector('.voice-btn');
            if (voiceBtn) {
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '<span class="pulse-dot"></span>';
            }
        };

        recognition.onresult = function(event) {
            clearTimeout(timeoutId);
            
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interimTranscript += transcript;
                }
            }

            const command = finalTranscript || interimTranscript;
            if (command) {
                showToast(`🎤: ${command}`, 'info');
            }

            if (finalTranscript) {
                recognition.stop();
                executeVoiceCommand(finalTranscript);
            }

            timeoutId = setTimeout(() => {
                if (interimTranscript && !finalTranscript) {
                    recognition.stop();
                    executeVoiceCommand(interimTranscript);
                }
            }, 2500);
        };

        recognition.onerror = function(event) {
            console.error('❌ خطأ في التعرف الصوتي:', event.error);
            
            if (event.error === 'not-allowed') {
                showToast('❌ يرجى السماح بالوصول إلى الميكروفون', 'error');
            } else if (event.error === 'no-speech') {
                showToast('⚠️ لم يتم سماع صوت، حاول مرة أخرى', 'warning');
            } else {
                showToast(`❌ خطأ: ${event.error}`, 'error');
            }
            
            const voiceBtn = document.querySelector('.voice-btn');
            if (voiceBtn) {
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '🎤';
            }
        };

        recognition.onend = function() {
            const voiceBtn = document.querySelector('.voice-btn');
            if (voiceBtn) {
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '🎤';
            }
            clearTimeout(timeoutId);
            console.log('🎤 انتهى التسجيل الصوتي');
        };

        try {
            recognition.start();
        } catch (e) {
            showToast('❌ فشل بدء التسجيل الصوتي', 'error');
        }
    };

    // ============================================================

    // ============================================================

    function patchVoiceButton() {
        const voiceBtn = document.querySelector('.voice-btn');
        if (voiceBtn && !voiceBtn.dataset.patched) {
            voiceBtn.dataset.patched = 'true';
            
            const newBtn = voiceBtn.cloneNode(true);
            voiceBtn.parentNode.replaceChild(newBtn, voiceBtn);
            
            newBtn.addEventListener('click', function(e) {
                e.stopPropagation();

            return true;
        }
        return false;
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(patchVoiceButton, 1500);
        });
    } else {

    }
