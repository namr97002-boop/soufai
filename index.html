<script>
(function() {
    'use strict';

    // ============================================================
    //  🎯 تمييز الصف عند النقر على الاسم - تغيير اللون بالكامل
    // ============================================================

    let selectedRow = null;

    function handleNameClick(e) {
        // البحث عن الخلية التي تم النقر عليها
        let td = e.target.closest('td');
        if (!td) return;

        // التأكد من أن العمود هو الثاني (الاسم)
        let allCells = td.parentElement.querySelectorAll('td');
        let colIndex = -1;
        for (let i = 0; i < allCells.length; i++) {
            if (allCells[i] === td) {
                colIndex = i;
                break;
            }
        }

        // فقط العمود الثاني (الاسم)
        if (colIndex !== 1) return;

        // الصف الذي تم النقر عليه
        let tr = td.closest('tr');
        if (!tr) return;

        // تجاهل الصفوف الخاصة
        if (tr.classList.contains('row-0') || 
            tr.classList.contains('row-1') || 
            tr.classList.contains('total-row')) {
            return;
        }

        // تجاهل إذا كانت الخلية قابلة للتعديل (نترك التعديل يعمل)
        if (td.classList.contains('editable') && td.isContentEditable) {
            return;
        }

        // إزالة التحديد من الصف السابق
        if (selectedRow) {
            selectedRow.classList.remove('selected-row');
            selectedRow.style.background = '';
            selectedRow.style.color = '';
        }

        // تمييز الصف الحالي
        tr.classList.add('selected-row');
        selectedRow = tr;

        // تطبيق الألوان مباشرة للتأكيد
        tr.style.background = 'linear-gradient(135deg, #1a237e, #0d47a1, #1565c0)';
        tr.style.color = '#ffffff';
        tr.style.borderTop = '3px solid #ffd700';
        tr.style.borderBottom = '3px solid #ffd700';
        tr.style.boxShadow = '0 0 50px rgba(13, 71, 161, 0.4)';
        tr.style.transform = 'scale(1.005)';

        // تمييز العمود 13 (المتبقي) بشكل خاص
        let cells = tr.querySelectorAll('td');
        if (cells.length > 12) {
            cells[12].style.background = 'linear-gradient(135deg, #ff6f00, #e65100, #bf360c)';
            cells[12].style.color = '#ffffff';
            cells[12].style.fontWeight = '900';
            cells[12].style.fontSize = '20px';
            cells[12].style.borderLeft = '4px solid #ffd700';
            cells[12].style.borderRight = '4px solid #ffd700';
            cells[12].style.boxShadow = '0 0 60px rgba(255, 152, 0, 0.4)';
            cells[12].style.transform = 'scale(1.1)';
        }

        // تمييز العمود 2 (الاسم) بشكل خاص
        if (cells.length > 1) {
            cells[1].style.color = '#ffd700';
            cells[1].style.fontWeight = '900';
            cells[1].style.fontSize = '18px';
            cells[1].style.textShadow = '0 0 30px rgba(255, 215, 0, 0.3)';
        }

        // تمييز العمود 1 (العداد) بشكل خاص
        if (cells.length > 0) {
            cells[0].style.color = '#ffd700';
            cells[0].style.fontWeight = '900';
            cells[0].style.fontSize = '17px';
            cells[0].style.textShadow = '0 0 20px rgba(255, 215, 0, 0.2)';
        }

        console.log(`✅ تم تمييز: ${cells[1]?.textContent || 'غير معروف'}`);
    }

    // ============================================================
    //  دالة لإزالة التمييز
    // ============================================================

    window.clearRowHighlight = function() {
        if (selectedRow) {
            selectedRow.classList.remove('selected-row');
            selectedRow.style.background = '';
            selectedRow.style.color = '';
            selectedRow.style.borderTop = '';
            selectedRow.style.borderBottom = '';
            selectedRow.style.boxShadow = '';
            selectedRow.style.transform = '';

            // إعادة تعيين الخلايا
            let cells = selectedRow.querySelectorAll('td');
            cells.forEach(cell => {
                cell.style.background = '';
                cell.style.color = '';
                cell.style.fontWeight = '';
                cell.style.fontSize = '';
                cell.style.borderLeft = '';
                cell.style.borderRight = '';
                cell.style.boxShadow = '';
                cell.style.transform = '';
                cell.style.textShadow = '';
            });

            selectedRow = null;
            console.log('✅ تم إلغاء التمييز');
        }
    };

    // ============================================================
    //  دالة لتمييز صف معين برقمه
    // ============================================================

    window.highlightRow = function(index) {
        let rows = document.querySelectorAll('#tableWrapper tbody tr');
        if (rows[index]) {
            // محاكاة النقر على الاسم في ذلك الصف
            let nameCell = rows[index].querySelector('td:nth-child(2)');
            if (nameCell) {
                let event = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                nameCell.dispatchEvent(event);
            }
        }
    };

    // ============================================================
    //  تهيئة النظام
    // ============================================================

    function init() {
        let table = document.getElementById('tableWrapper');
        if (!table) {
            setTimeout(init, 300);
            return;
        }

        // إزالة المستمع القديم لتجنب التكرار
        table.removeEventListener('click', handleNameClick);
        table.addEventListener('click', handleNameClick);

        console.log('✅ تم تفعيل تمييز الصف عند النقر على الاسم');
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // ============================================================
    //  مراقبة التغييرات في الجدول
    // ============================================================

    let observer = new MutationObserver(function() {
        let table = document.getElementById('tableWrapper');
        if (table) {
            init();
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('🎯 نظام تمييز الصف جاهز - انقر على أي اسم لتمييز الصف');

})();
// ============================================================
//  دوال الرسائل النصية - جميع المشتركين
// ============================================================

// ===== جلب جميع المشتركين من كل القرى =====
const fetchAllForSms = useCallback(async () => {
    setSmsAllLoading(true);
    const results = [];
    
    for (const v of VILLAGES_LIST) {
        try {
            const apiUrl = villageAPIs[v];
            if (!apiUrl) continue;
            
            const url = `${apiUrl}?sheet=${encodeURIComponent(month)}&t=${Date.now()}`;
            const res = await fetch(url);
            if (!res.ok) continue;
            
            const data = await res.json();
            if (!data || !Array.isArray(data)) continue;
            
            for (let i = 2; i < data.length - 1; i++) {
                const row = data[i];
                if (!row || !row[1] || row[1] === 'الاسم') continue;
                
                const phone = (row[0] || '').toString().trim();
                if (!phone || phone.length < 9) continue;
                
                results.push({
                    village: v,
                    meterNumber: row[0] || '-',
                    name: row[1] || 'غير معروف',
                    phone: phone,
                    previous: row[2] || 0,
                    current: row[3] || 0,
                    total: parseFloat(row[9] || 0),
                    paid: parseFloat(row[11] || 0),
                    remaining: parseFloat(row[12] || 0),
                    date: row[14] || '-'
                });
            }
        } catch (e) {
            console.warn(`⚠️ فشل جلب ${v}:`, e);
        }
    }
    
    results.sort((a, b) => a.name.localeCompare(b.name));
    setSmsAllData(results);
    setSmsAllLoading(false);
    showSync(`✅ تم تحميل ${results.length} مشترك لديهم أرقام هواتف`, 'success');
}, [month, showSync]);

// ===== بناء رسالة المشترك =====
const buildSmsMessage = useCallback((subscriber) => {
    const monthNum = month.replace('شهر ', '');
    const diff = parseFloat(subscriber.current) - parseFloat(subscriber.previous);
    const remaining = parseFloat(subscriber.remaining);
    const warning = remaining >= 5000 ? ' ⚠️ إنذار بالفصل' : '';
    return `فاتورة شهر ${monthNum}: سابقة: ${subscriber.previous}, حالية: ${subscriber.current}, الفارق: ${diff}, المجموع: ${subscriber.total}, المسلم: ${subscriber.paid}, المتبقي: ${subscriber.remaining}${warning}`;
}, [month]);

// ============================================================
//  🚀 إرسال رسالة فردية - أقصى سرعة (بدون أي تأخير)
// ============================================================

const sendSingleSmsAll = useCallback((subscriber) => {
    if (!subscriber) return;
    
    const message = buildSmsMessage(subscriber);
    
    let phone = subscriber.phone.replace(/\s/g, '');
    if (phone.startsWith('0')) phone = phone.substring(1);
    if (phone.length === 9 && phone.startsWith('7')) {
        phone = '+967' + phone;
    }
    
    window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
    
}, [buildSmsMessage]);
</script>
<script>
(function() {
    'use strict';
    
    // ============================================================
    //  🎯 تلوين العمود 13 (المتبقي) - نسخة مبسطة
    // ============================================================
    
    function colorRemainingColumn() {
        const table = document.querySelector('#tableWrapper table');
        if (!table) {
            setTimeout(colorRemainingColumn, 500);
            return;
        }
        
        const rows = table.querySelectorAll('tbody tr');
        const totalRows = rows.length;
        
        rows.forEach((row, index) => {
            // تخطي الصفوف الخاصة والصف الأخير
            if (row.classList.contains('row-0') || 
                row.classList.contains('row-1') || 
                row.classList.contains('total-row') ||
                index === totalRows - 1) {
                return;
            }
            
            const cells = row.querySelectorAll('td');
            if (cells.length < 13) return;
            
            const remainingCell = cells[12];
            const remaining = parseFloat(remainingCell.textContent.trim()) || 0;
            
            // إزالة الكلاسات القديمة
            remainingCell.classList.remove('low-debt', 'high-debt', 'zero-debt');
            
            // إضافة الكلاسة المناسبة
            if (remaining >= 5000) {
                remainingCell.classList.add('high-debt');
            } else if (remaining === 0) {
                remainingCell.classList.add('zero-debt');
            } else {
                remainingCell.classList.add('low-debt');
            }
            
            // ✅ تطبيق التلوين مباشرة (ضمان)
            if (remaining >= 5000) {
                remainingCell.style.background = 'linear-gradient(135deg, #ff1744, #d50000)';
                remainingCell.style.color = '#ffffff';
                remainingCell.style.borderLeft = '3px solid #ff1744';
                remainingCell.style.borderRight = '3px solid #ff1744';
                remainingCell.style.animation = 'debtPulse 1.5s ease-in-out infinite';
                remainingCell.style.borderRadius = '8px';
            } else {
                remainingCell.style.background = '#000000';
                remainingCell.style.color = '#ffffff';
                remainingCell.style.borderLeft = '3px solid #333333';
                remainingCell.style.borderRight = '3px solid #333333';
                remainingCell.style.animation = 'none';
                remainingCell.style.borderRadius = '0';
            }
        });
        
        console.log('✅ تم تلوين العمود 13');
    }
    
    // ============================================================
    //  تشغيل عند تحميل الصفحة
    // ============================================================
    
    // تشغيل فوري
    setTimeout(colorRemainingColumn, 1000);
    
    // مراقبة التغييرات
    const observer = new MutationObserver(function() {
        colorRemainingColumn();
    });
    observer.observe(document.body, { childList: true, subtree: true });
    
    // جعل الدالة عامة
    window.colorRemainingColumn = colorRemainingColumn;
    
    console.log('✅ تم تفعيل تلوين العمود 13 (المتبقي)');
    
})();
</script>
<script>
    (function() {
        'use strict';

        // ============================================================
        //  🔥 تسجيل Service Worker مع تخزين فوري للصفحة
        // ============================================================

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(function(reg) {
                    console.log('✅ Service Worker مسجل بنجاح');

                    // ===== تخزين الصفحة الحالية فوراً =====
                    if (reg.active) {
                        reg.active.postMessage({
                            type: 'CACHE_PAGE',
                            url: window.location.href
                        });
                    }

                    // ===== مراقبة حالة الـ SW =====
                    if (reg.installing) {
                        console.log('⏳ جاري تثبيت الـ SW...');
                    } else if (reg.waiting) {
                        console.log('⏳ الـ SW في انتظار التفعيل...');
                    } else if (reg.active) {
                        console.log('✅ الـ SW نشط وجاهز');
                    }

                })
                .catch(function(err) {
                    console.warn('⚠️ فشل تسجيل Service Worker:', err);
                });

            // ===== مراقبة تغييرات الـ SW =====
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                console.log('🔄 تم تغيير الـ SW، إعادة تحميل الصفحة...');
                window.location.reload();
            });
        }

        // ============================================================
        //  💾 حفظ الصفحة في localStorage كنسخة احتياطية
        // ============================================================

        try {
            // حفظ شاشة الدخول (للحالات الطارئة)
            localStorage.setItem('soufai_login_page', document.documentElement.outerHTML);
            localStorage.setItem('soufai_last_save', new Date().toISOString());
            console.log('✅ تم حفظ شاشة الدخول في localStorage');
        } catch(e) {
            console.warn('⚠️ فشل حفظ شاشة الدخول:', e);
        }

        // ============================================================
        //  📶 استعادة شاشة الدخول عند انقطاع النت (حل احتياطي)
        // ============================================================

        if (!navigator.onLine) {
            console.log('📶 غير متصل - جاري استعادة شاشة الدخول...');
            try {
                const saved = localStorage.getItem('soufai_login_page');
                if (saved && saved.length > 1000) {
                    // نستعيد فقط إذا كانت الصفحة فارغة
                    if (document.body.innerHTML.trim() === '' || 
                        document.querySelector('.login-wrapper') === null) {
                        document.open();
                        document.write(saved);
                        document.close();
                        console.log('✅ تم استعادة شاشة الدخول من localStorage');
                    }
                }
            } catch(e) {
                console.error('❌ فشل استعادة شاشة الدخول:', e);
            }
        }

        console.log('🔒 نظام التشغيل بدون إنترنت جاهز 100%');
    })();
</script>
