/* الساعة - كبيرة وذهبية */
.time-display {
    font-size: 48px !important;
    font-weight: 900 !important;
    color: #ffd700 !important;
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.3), 0 0 80px rgba(255, 215, 0, 0.1) !important;
    letter-spacing: 5px !important;
    font-family: 'Tajawal', monospace !important;
    direction: ltr !important;
    display: block !important;
}

/* التاريخ */
.date-display {
    font-size: 18px !important;
    color: rgba(255, 255, 255, 0.9) !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 12px !important;
    margin-top: 6px !important;
    flex-wrap: wrap !important;
}

.date-display span:not(:first-child) {
    background: rgba(255, 255, 255, 0.06) !important;
    padding: 4px 14px !important;
    border-radius: 12px !important;
    border: 1px solid rgba(255, 255, 255, 0.06) !important;
}

/* ===== تنسيق للجوال ===== */
@media (max-width: 600px) {
    .time-display {
        font-size: 36px !important;
    }
    .date-display {
        font-size: 14px !important;
        gap: 6px !important;
    }
}
/* ===== تنسيق التاريخ الهجري ===== */
.date-display span:last-child {
    background: rgba(255, 215, 0, 0.1) !important;
    border: 1px solid rgba(255, 215, 0, 0.2) !important;
    color: #ffd700 !important;
    font-weight: bold !important;
}

/* أيقونة الهجري */
.date-display span:nth-last-child(2) {
    font-size: 18px !important;
}
/* ===== جعل حقل الرمز السري أبيض بالكامل ===== */
.login-input {
    background: #ffffff !important;
    color: #000000 !important;
    border: 2px solid #cccccc !important;
    padding: 12px 20px !important;
    font-size: 18px !important;
    border-radius: 10px !important;
    width: 100% !important;
    box-sizing: border-box !important;
}

.login-input::placeholder {
    color: #888888 !important;
}

.login-input:focus {
    background: #ffffff !important;
    border-color: #ffd700 !important;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.2) !important;
    outline: none !important;
}
/* ===== خلفية لوحة الأزرار فقط - أسود مع نصوص بيضاء عريضة ===== */

.control-bar {
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d) !important;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
}

/* نصوص لوحة الأزرار فقط - بيضاء عريضة */
.control-bar * {
    color: #ffffff !important;
    font-weight: 700 !important;
}

/* الأزرار داخل لوحة التحكم */
.control-bar .btn {
    background: rgba(255, 255, 255, 0.08) !important;
    border-color: rgba(255, 255, 255, 0.15) !important;
    color: #ffffff !important;
    font-weight: 700 !important;
}

.control-bar .btn:hover {
    background: rgba(255, 255, 255, 0.18) !important;
}
/* ================================================================
   🎨 تلوين الأعمدة من الصف 4 إلى ما قبل آخر صف
   ================================================================ */

/* ===== تخطي الصفوف الخاصة (الصف 0 و 1 و الأخير) ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(1) {
    background: linear-gradient(135deg, #E3F2FD, #BBDEFB) !important;
    color: #0D47A1 !important;
    font-weight: 900 !important;
    border-left: 3px solid #1976D2 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(2) {
    background: linear-gradient(135deg, #F5F5F5, #E0E0E0) !important;
    color: #212121 !important;
    font-weight: 900 !important;
    min-width: 180px !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(3) {
    background: linear-gradient(135deg, #E8F5E9, #C8E6C9) !important;
    color: #1B5E20 !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(4) {
    background: linear-gradient(135deg, #FFF3E0, #FFE0B2) !important;
    color: #E65100 !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(5) {
    background: linear-gradient(135deg, #F3E5F5, #E1BEE7) !important;
    color: #4A148C !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(6) {
    background: linear-gradient(135deg, #E0F7FA, #B2EBF2) !important;
    color: #006064 !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(7) {
    background: linear-gradient(135deg, #F1F8E9, #DCEDC8) !important;
    color: #33691E !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(8) {
    background: linear-gradient(135deg, #FFF8E1, #FFECB3) !important;
    color: #FF6F00 !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(9) {
    background: linear-gradient(135deg, #E8F5E9, #A5D6A7) !important;
    color: #1B5E20 !important;
    font-weight: 800 !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(10) {
    background: linear-gradient(135deg, #EDE7F6, #D1C4E9) !important;
    color: #4A148C !important;
    font-weight: 900 !important;
    font-size: 15px !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(11) {
    background: linear-gradient(135deg, #E1F5FE, #B3E5FC) !important;
    color: #01579B !important;
    font-weight: 800 !important;
    min-width: 60px !important;
    max-width: 80px !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(12) {
    background: linear-gradient(135deg, #E8F5E9, #81C784) !important;
    color: #1B5E20 !important;
    font-weight: 900 !important;
    font-size: 15px !important;
}

#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(13) {
    background: linear-gradient(135deg, #FFEBEE, #FFCDD2) !important;
    color: #C62828 !important;
    font-weight: 900 !important;
    font-size: 17px !important;
    border-left: 3px solid #EF5350 !important;
    border-right: 3px solid #EF5350 !important;
}

/* ===== المتبقي العالي (5000+) ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td:nth-child(13).high-debt {
    background: linear-gradient(135deg, #ff1744, #d50000) !important;
    color: white !important;
    animation: debtPulse 1.5s ease-in-out infinite !important;
    box-shadow: 0 0 30px rgba(255, 23, 68, 0.2) !important;
    border-radius: 8px !important;
}

@keyframes debtPulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
    }
}

/* ===== تأثير التمرير على الصفوف ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row):hover td {
    filter: brightness(0.95);
    transform: scale(1.001);
    transition: all 0.3s ease;
}

/* ===== حدود بين الأعمدة ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row) td {
    border-left: 1px solid rgba(0, 0, 0, 0.06);
    border-right: 1px solid rgba(0, 0, 0, 0.06);
    padding: 10px 8px;
    text-align: center;
    font-size: 14px;
    transition: all 0.3s ease;
}
/* ================================================================
   🎯 تمييز الصف عند النقر على الاسم
   ================================================================ */

/* ===== الصف المحدد - تغيير اللون بالكامل ===== */
#tableWrapper tbody tr.selected-row td {
    background: linear-gradient(135deg, #1a237e, #0d47a1, #1565c0) !important;
    color: #ffffff !important;
    border-top: 3px solid #ffd700 !important;
    border-bottom: 3px solid #ffd700 !important;
    box-shadow: 0 0 50px rgba(13, 71, 161, 0.4) !important;
    transform: scale(1.005) !important;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2) !important;
}

/* ===== العمود 13 (المتبقي) عند التحديد ===== */
#tableWrapper tbody tr.selected-row td:nth-child(13) {
    background: linear-gradient(135deg, #ff6f00, #e65100, #bf360c) !important;
    color: #ffffff !important;
    font-weight: 900 !important;
    font-size: 20px !important;
    border-left: 4px solid #ffd700 !important;
    border-right: 4px solid #ffd700 !important;
    box-shadow: 0 0 60px rgba(255, 152, 0, 0.4) !important;
    transform: scale(1.1) !important;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.3) !important;
    animation: pulseOrange 0.8s ease-in-out infinite !important;
}

/* ===== العمود 2 (الاسم) عند التحديد ===== */
#tableWrapper tbody tr.selected-row td:nth-child(2) {
    color: #ffd700 !important;
    font-weight: 900 !important;
    font-size: 18px !important;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.3) !important;
}

/* ===== العمود 1 (العداد) عند التحديد ===== */
#tableWrapper tbody tr.selected-row td:nth-child(1) {
    color: #ffd700 !important;
    font-weight: 900 !important;
    font-size: 17px !important;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.2) !important;
}
/* ============================================================
   🎯 تلوين الصف الأول فقط (row-0) - بدون تثبيت
   ============================================================ */

/* ✅ تلوين الصف الأول - أزرق فاخر */
#tableWrapper .row-0 td {
    text-align: center !important;
    font-size: 22px !important;
    font-weight: 900 !important;
    background: linear-gradient(135deg, #0a1628, #0d47a1, #1565c0) !important;
    color: white !important;
    padding: 16px 12px !important;
    border-bottom: 4px solid #4cc9f0 !important;
    text-shadow: 0 2px 15px rgba(76, 201, 240, 0.3) !important;
    letter-spacing: 1px !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
    background-size: 300% 300% !important;
    animation: gradientMove 4s ease-in-out infinite !important;
}

/* ✅ حركة التدرج */
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ✅ تلوين صف المجموع (للتناسق) */
#tableWrapper .total-row td {
    background: linear-gradient(135deg, #ffb703, #fb8500) !important;
    color: #1a1a2e !important;
    font-weight: 900 !important;
    font-size: 16px !important;
    padding: 14px 10px !important;
    border-top: 3px solid rgba(255, 215, 0, 0.3) !important;
}

/* ✅ تلوين صفوف المديونية العالية */
#tableWrapper tbody tr.debt-row td:nth-child(13) {
    background: linear-gradient(135deg, #ff1744, #d50000) !important;
    color: white !important;
    animation: debtPulse 1.5s ease-in-out infinite !important;
    border-radius: 8px !important;
    font-weight: 900 !important;
}

/* ✅ حركة النبض للمديونية */
@keyframes debtPulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
    }
}
/* ============================================================
   🎯 تلوين عنوان القرية فقط (داخل thead)
   ============================================================ */

/* ✅ تلوين الصف الأول في thead (عنوان القرية) */
#tableWrapper thead tr:first-child td {
    background: linear-gradient(135deg, #0a1628, #0d47a1, #1565c0) !important;
    color: white !important;
    text-align: center !important;
    font-size: 22px !important;
    font-weight: 900 !important;
    padding: 16px 12px !important;
    border-bottom: 4px solid #4cc9f0 !important;
    text-shadow: 0 2px 15px rgba(76, 201, 240, 0.3) !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
}
/* ============================================================
   🎨 تلوين رأس الجدول فقط - أزرق فاخر
   ============================================================ */

/* ✅ تلوين رأس الجدول (thead) */
.table-container thead {
    position: sticky;
    top: 0;
    z-index: 100;
}

/* ✅ تلوين الصف الأول في الرأس (row-0) - اسم القرية */
.table-container thead tr.row-0 td {
    background: linear-gradient(135deg, #0a1628, #0d47a1, #1565c0) !important;
    color: #ffffff !important;
    font-size: 24px !important;
    font-weight: 900 !important;
    text-align: center !important;
    padding: 18px 15px !important;
    border-bottom: 4px solid #4cc9f0 !important;
    text-shadow: 0 0 30px rgba(76, 201, 240, 0.3) !important;
    letter-spacing: 2px !important;
    box-shadow: 0 4px 30px rgba(13, 71, 161, 0.3) !important;
}

/* ✅ تلوين الصف الثاني في الرأس (row-1) - أسماء الأعمدة */
.table-container thead tr.row-1 th,
.table-container thead tr.row-1 td {
    background: linear-gradient(135deg, #1565c0, #1e88e5, #1976d2) !important;
    color: #ffffff !important;
    font-size: 16px !important;
    font-weight: 900 !important;
    text-align: center !important;
    padding: 14px 12px !important;
    border-bottom: 3px solid rgba(255, 255, 255, 0.15) !important;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2) !important;
    letter-spacing: 0.5px !important;
}

/* ✅ تلوين رأس الجدول العادي (إذا لم يكن هناك row-0/row-1) */
.table-container thead th {
    background: linear-gradient(135deg, #0d1b2a, #1b3a5c, #0077b6) !important;
    color: white !important;
    font-size: 15px !important;
    font-weight: 900 !important;
    padding: 15px 12px !important;
    border-bottom: 3px solid rgba(255, 255, 255, 0.1) !important;
    text-align: center !important;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2) !important;
}

/* ✅ تأثير hover على رأس الجدول */
.table-container thead th:hover,
.table-container thead tr.row-1 th:hover {
    background: linear-gradient(135deg, #1e88e5, #2196f3) !important;
    transition: all 0.3s ease !important;
}

/* ✅ تلوين صف المجموع (إذا كان في الأسفل) - يبقى برتقالي */
.table-container tbody tr.total-row td {
    background: linear-gradient(135deg, #ffb703, #fb8500) !important;
    color: #1a1a2e !important;
    font-weight: 900 !important;
    font-size: 17px !important;
    padding: 14px 10px !important;
    border-top: 4px solid rgba(255, 215, 0, 0.3) !important;
    position: sticky !important;
    bottom: 0 !important;
    z-index: 50 !important;
}
/* ===== رأس جدول أزرق فاخر مع إلغاء تام للتنسيقات السابقة ===== */
.row-0 td,
.row-1 td,
.table-container thead tr td,
.table-container thead tr th,
.table-container thead th,
#tableWrapper .row-0 td,
#tableWrapper .row-1 td,
#tableWrapper thead td,
#tableWrapper thead th {
    /* إلغاء كل الخلفيات السابقة */
    background: #1a237e !important;
    background-color: #1a237e !important;
    background-image: none !important;
    background: #1a237e !important;
    
    /* إلغاء أي تنسيقات حدود سابقة ووضع حدود أنيقة */
    border-color: #0d1445 !important;
    
    /* لون النص أبيض مع إلغاء أي تنسيق نص سابق */
    color: #ffffff !important;
    text-shadow: none !important;
    
    /* إلغاء أي ظلال أو تأثيرات */
    box-shadow: none !important;
    
    /* إضافات جمالية للون الأزرق الفاخر */
    border-bottom: 2px solid #0d1445 !important;
    font-weight: 600 !important;
}
/* ================================================================
   🎯 تلوين العمود 13 (المتبقي) - أقل من 5000 = خلفية سوداء ونص أبيض
   ✅ استثناء الصف الأخير (صف المجموع)
   ================================================================ */

/* ===== إلغاء كل التلوين السابق للعمود 13 ===== */
#tableWrapper tbody td:nth-child(13) {
    background: transparent !important;
    background-image: none !important;
    animation: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    border-left: none !important;
    border-right: none !important;
}

/* ===== تلوين العمود 13 للصفوف العادية فقط (ما عدا الصف الأخير) ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row):not(:last-child) td:nth-child(13) {
    background: #000000 !important;
    color: #ffffff !important;
    font-weight: 900 !important;
    border-left: 3px solid #333333 !important;
    border-right: 3px solid #333333 !important;
    transition: all 0.3s ease !important;
}

/* ===== المتبقي 5000 فأكثر - أحمر متوهج ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row):not(:last-child) td:nth-child(13).high-debt {
    background: linear-gradient(135deg, #ff1744, #d50000) !important;
    color: #ffffff !important;
    border-left: 3px solid #ff1744 !important;
    border-right: 3px solid #ff1744 !important;
    animation: debtPulse 1.5s ease-in-out infinite !important;
    border-radius: 8px !important;
}

/* ===== المتبقي صفر - أسود مع أزرق ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row):not(:last-child) td:nth-child(13).zero-debt {
    background: #000000 !important;
    color: #4cc9f0 !important;
    border-left: 3px solid #4cc9f0 !important;
    border-right: 3px solid #4cc9f0 !important;
}

/* ===== المتبقي أقل من 5000 - أسود مع أبيض (الافتراضي) ===== */
#tableWrapper tbody tr:not(.row-0):not(.row-1):not(.total-row):not(:last-child) td:nth-child(13).low-debt {
    background: #000000 !important;
    color: #ffffff !important;
    border-left: 3px solid #333333 !important;
    border-right: 3px solid #333333 !important;
}

/* ===== الصف الأخير (المجموع) يبقى برتقالي ===== */
#tableWrapper tbody tr:last-child td:nth-child(13),
#tableWrapper tbody tr.total-row td:nth-child(13) {
    background: linear-gradient(135deg, #ffb703, #fb8500) !important;
    color: #1a1a1a !important;
    font-weight: 900 !important;
    border: none !important;
    animation: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
}

/* ===== حركة النبض للمديونية العالية ===== */
@keyframes debtPulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
    }
}
/* ================================================================
   🎨 تلوين جميع الأزرار باللون الأزرق الفاخر
   ================================================================ */

/* ===== جميع الأزرار في المشروع ===== */
.btn,
button:not(.close-report-modal):not(.search-result-close):not(.close-fullscreen):not(.ai-report-close):not(.btn-enter):not(.btn-theme):not(.voice-btn) {
    background: linear-gradient(135deg, #1a237e, #0d47a1, #1565c0) !important;
    border: 2px solid rgba(26, 35, 126, 0.3) !important;
    color: #ffffff !important;
    box-shadow: 0 4px 20px rgba(26, 35, 126, 0.3) !important;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    font-weight: 700 !important;
}

/* ===== hover ===== */
.btn:hover,
button:not(.close-report-modal):not(.search-result-close):not(.close-fullscreen):not(.ai-report-close):not(.btn-enter):not(.btn-theme):not(.voice-btn):hover {
    background: linear-gradient(135deg, #0d47a1, #0a1628, #1a237e) !important;
    border-color: rgba(26, 35, 126, 0.6) !important;
    box-shadow: 0 8px 35px rgba(26, 35, 126, 0.5) !important;
    transform: translateY(-3px) scale(1.03) !important;
}

/* ===== active (عند الضغط) ===== */
.btn:active,
button:not(.close-report-modal):not(.search-result-close):not(.close-fullscreen):not(.ai-report-close):not(.btn-enter):not(.btn-theme):not(.voice-btn):active {
    transform: scale(0.95) !important;
}

/* ================================================================
   🔥 استثناءات - أزرار تبقى كما هي
   ================================================================ */

/* ===== زر الدخول في شاشة الدخول ===== */
.btn-enter {
    background: linear-gradient(135deg, #ffb703, #fb8500) !important;
    color: #1a1a2e !important;
    box-shadow: 0 5px 25px rgba(255, 183, 3, 0.4) !important;
}
.btn-enter:hover {
    background: linear-gradient(135deg, #fb8500, #f7971e) !important;
    box-shadow: 0 8px 35px rgba(255, 183, 3, 0.5) !important;
}

/* ===== زر الخروج ===== */
.btn-danger,
button[title="خروج"] {
    background: linear-gradient(135deg, #dc3545, #b02a37) !important;
    border-color: rgba(220, 53, 69, 0.3) !important;
    color: white !important;
}

                .replace(/[ة]/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function convertArabicNumbers(text) {
            if (!text) return '';
            const arabicNumbers = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8',
                '٩': '9' };
            return text.toString().replace(/[٠-٩]/g, char => arabicNumbers[char] || char);
        }

        function calculateSimilarity(text1, text2) {
            if (!text1 || !text2) return 0;
            const t1 = normalizeText(text1);
            const t2 = normalizeText(text2);
            let matches = 0;
            for (let c of t2) {
                if (t1.includes(c)) matches++;
            }
            return matches / Math.max(t2.length, 1);
        }

        // ============================================================
        //  دوال البحث المتطورة
        // ============================================================

        function searchByNameTriplet(query, data) {
            if (!data || !data.length || !query) return [];

            const normalizedQuery = normalizeText(query);
            const queryParts = normalizedQuery.split(/\s+/).filter(p => p.length > 0);
            if (queryParts.length === 0) return [];

            const results = [];

            for (let i = 2; i < data.length; i++) {
                const row = data[i];
                if (i === 0 || i === 1 || i === data.length - 1) continue;
                if (!row || !row[1]) continue;

                const originalName = row[1].toString().trim();
                if (!originalName) continue;

                const cleanedDB = normalizeText(originalName);
                const dbParts = cleanedDB.split(/\s+/).filter(p => p.length > 0);

                let searchIndex = 0;
                for (let j = 0; j < dbParts.length && searchIndex < queryParts.length; j++) {
                    if (dbParts[j] === queryParts[searchIndex]) {
                        searchIndex++;
                    }
                }

                if (searchIndex === queryParts.length) {
                    results.push({
                        originalIndex: i,
                        meterNumber: row[0] || '',
                        name: originalName,
                        rowData: row,
                        score: 100,
                        matchType: 'مطابقة تامة (ثلاثي)',
                        remaining: parseNumber(row[12]),
                        paid: parseNumber(row[11]),
                        total: parseNumber(row[9])
                    });
                }
            }

            return results;
        }

        function smartSearch(query, data) {
            if (!data || !data.length || !query) return [];

            const q = convertArabicNumbers(query).trim();
            const normalizedQ = normalizeText(q);
            const isNumber = /^\d+$/.test(q);
            const results = [];

            for (let i = 2; i < data.length; i++) {
                const row = data[i];
                if (i === 0 || i === 1 || i === data.length - 1) continue;
                if (!row || !row[1]) continue;

                const name = row[1] ? row[1].toString() : '';
                const meter = row[0] ? row[0].toString() : '';

                if (!name && !meter) continue;

                let score = 0;
                let matchType = '';
                let matchedParts = [];

                if (isNumber) {
                    if (meter === q) {
                        score = 100;
                        matchType = 'رقم عداد تام';
                        matchedParts = [meter];
                    } else if (meter.includes(q)) {
                        score = 85;
                        matchType = 'رقم عداد جزئي';
                        matchedParts = [meter];
                    }
                }

                if (score === 0) {
                    const normalizedName = normalizeText(name);

                    if (normalizedName === normalizedQ) {
                        score = 100;
                        matchType = 'اسم تام';
                        matchedParts = [name];
                    } else if (normalizedName.startsWith(normalizedQ)) {
                        score = 90;
                        matchType = 'يبدأ بـ';
                        matchedParts = [name];
                    } else if (normalizedName.includes(normalizedQ)) {
                        score = 80;
                        matchType = 'يحتوي على';
                        matchedParts = [name];
                    } else {
                        const similarity = calculateSimilarity(normalizedName, normalizedQ);
                        if (similarity > 0.5) {
                            score = Math.round(similarity * 75);
                            matchType = `تشابه ${Math.round(similarity * 100)}%`;
                            matchedParts = [name];
                        }
                    }
                }

                if (score === 0 && q.length >= 3) {
                    const tripletResults = searchByNameTriplet(q, data);
                    const found = tripletResults.find(r => r.originalIndex === i);
                    if (found) {
                        score = found.score;
                        matchType = found.matchType;
                        matchedParts = [name];
                    }
                }

                if (score > 0) {
                    results.push({
                        originalIndex: i,
                        meterNumber: meter,
                        name: name || 'غير معروف',
                        rowData: row,
                        score: score,
                        matchType: matchType,
                        remaining: parseNumber(row[12]),
                        paid: parseNumber(row[11]),
                        total: parseNumber(row[9]),
                        matchedParts: matchedParts
                    });
                }
            }

            results.sort((a, b) => b.score - a.score);
            return results.slice(0, 20);
        }

        function analyzeSearchQuery(query) {
            const result = {
                hasOperation: false,
                hasVillageChange: false,
                hasMonthChange: false,
                hasAttendance: false,
                village: '',
                month: '',
                name: '',
                operation: '',
                value: null,
                rawQuery: query,
                isHelp: false,
                isReport: false
            };

            if (!query) return result;

            const trimmed = convertArabicNumbers(query).trim();
            const words = trimmed.split(/\s+/);

            if (['مساعدة', 'شرح', 'كيف', 'طريقة'].some(w => words.includes(w))) {
                result.isHelp = true;
                return result;
            }

            if (['تقرير', 'إحصاء', 'ملخص'].some(w => words.includes(w))) {
                result.isReport = true;
                return result;
            }

            if (VILLAGES_LIST.includes(trimmed)) {
                result.hasVillageChange = true;
                result.village = trimmed;
                return result;
            }

            if (trimmed.startsWith('شهر ')) {
                const num = trimmed.substring(4).trim();
                if (/^\d+$/.test(num)) {
                    result.hasMonthChange = true;
                    result.month = 'شهر ' + num;
                    return result;
                }
            }

            if (words.length >= 3 && VILLAGES_LIST.includes(words[0]) && words[1] === 'شهر' && /^\d+$/.test(words[2])) {
                result.village = words[0];
                result.month = 'شهر ' + words[2];
                result.hasVillageChange = true;
                result.hasMonthChange = true;

                if (words.length >= 6) {
                    const name = words.slice(3, words.length - 2).join(' ');
                    const op = words[words.length - 2];
                    const val = words[words.length - 1];
                    if (/^\d+$/.test(val) && (op.includes('مسلم') || op.includes('حالي') || op.includes('قراءة'))) {
                        result.hasOperation = true;
                        result.name = name.trim();
                        result.operation = op.includes('مسلم') ? 'paid' : 'current';
                        result.value = parseInt(val);
                    }
                }
                return result;
            }

            if (words.length >= 3) {
                const last = words[words.length - 1];
                const second = words[words.length - 2];
                if (/^\d+$/.test(last) && (second.includes('مسلم') || second.includes('حالي') || second.includes('قراءة'))) {
                    result.hasOperation = true;
                    result.name = words.slice(0, words.length - 2).join(' ').trim();
                    result.operation = second.includes('مسلم') ? 'paid' : 'current';
                    result.value = parseInt(last);
                    return result;
                }
            }

            if (['حضور', 'سجل الحضور', 'دخول', 'موظفين'].some(w => words.includes(w))) {
                result.hasAttendance = true;
                return result;
            }

            if (trimmed.length >= 1) {
                result.name = trimmed;
            }

            return result;
        }

        function saveToCache(key, data) {
            try {
                const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                cache[key] = { data: data, timestamp: Date.now() };
                localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
            } catch (e) { console.warn('فشل حفظ الكاش:', e); }
        }

        function getFromCache(key) {
            try {
                const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                const item = cache[key];
                if (item && Date.now() - item.timestamp < 24 * 60 * 60 * 1000) {
                    return item.data;
                }
                return null;
            } catch (e) { return null; }
        }

        function saveReportToCache(data) {
            try {
                localStorage.setItem(REPORT_CACHE_KEY, JSON.stringify({ data: data, timestamp: Date.now() }));
            } catch (e) { console.warn('فشل حفظ كاش التقرير:', e); }
        }

        function getReportFromCache() {

                if (item && Date.now() - item.timestamp < 24 * 60 * 60 * 1000) {

                    data: data,

                };
                localStorage.setItem(BACKUP_KEY, JSON.stringify(backup));

        function isValidBackup(backup) {
            if (!backup) return false;
            if (!backup.data || !Array.isArray(backup.data)) return false;
            if (backup.data.length < 3) return false;
            if (!backup.village || !backup.month) return false;
            return true;
        }

        // ============================================================
        //  دوال الذكاء الاصطناعي
        // ============================================================

        function analyzeDataWithAI(data, village, month) {
            const analysis = {
                totalDebt: 0,
                totalRevenue: 0,
                totalPaid: 0,
                totalSubscribers: 0,
                activeSubscribers: 0,
                totalConsumption: 0,
                highRiskCount: 0,
                mediumRiskCount: 0,
                anomalies: [],
                patterns: [],
                predictions: [],
                totalConsumptionLow: 0,
                totalConsumptionHigh: 0,
                village: village,
                month: month
            };

            if (!data || data.length === 0) return analysis;

            for (let i = 2; i < data.length - 1; i++) {
                const row = data[i];
                if (!row || !Array.isArray(row)) continue;
                if (!row[1] || row[1] === 'الاسم') continue;

                const meterNumber = row[0] || '';
                const name = row[1] || '';
                const previousReading = parseNumber(row[2]);
                const currentReading = parseNumber(row[3]);
                const consumption = currentReading - previousReading;
                const required = parseNumber(row[9]);
                const paid = parseNumber(row[11]);
                const remaining = parseNumber(row[12]);
                const consumptionLow = parseNumber(row[4]);
                const consumptionHigh = parseNumber(row[5]);

                analysis.totalDebt += remaining;
                analysis.totalRevenue += required;
                analysis.totalPaid += paid;
                analysis.totalSubscribers++;
                analysis.totalConsumptionLow += consumptionLow;
                analysis.totalConsumptionHigh += consumptionHigh;

                if (consumption > 0) {
                    analysis.activeSubscribers++;
                    analysis.totalConsumption += consumption;
                }

                if (remaining > 10000) {
                    analysis.highRiskCount++;
                    analysis.anomalies.push({
                        type: 'high_debt',
                        meterNumber: meterNumber,
                        name: name,
                        value: remaining,
                        message: `مديونية عالية جداً: ${formatNumber(remaining)}`,
                        priority: 'high'
                    });
                } else if (remaining > 5000) {
                    analysis.mediumRiskCount++;
                    analysis.anomalies.push({
                        type: 'medium_debt',
                        meterNumber: meterNumber,
                        name: name,
                        value: remaining,
                        message: `مديونية متوسطة: ${formatNumber(remaining)}`,
                        priority: 'medium'
                    });
                }

                if (consumption > 100 && consumption > 0) {
                    analysis.anomalies.push({
                        type: 'high_consumption',
                        meterNumber: meterNumber,
                        name: name,
                        value: consumption,
                        message: `استهلاك مرتفع: ${consumption} م³`,
                        priority: 'medium'
                    });
                }

                if (remaining > 0 && paid === 0) {
                    analysis.patterns.push({
                        type: 'non_payer',
                        meterNumber: meterNumber,
                        name: name,
                        value: remaining,
                        message: `لم يسدد منذ فترة: ${formatNumber(remaining)}`,
                        priority: 'high'
                    });
                }

                if (remaining > required * 0.5 && required > 0) {
                    analysis.patterns.push({
                        type: 'high_debt_ratio',
                        meterNumber: meterNumber,
                        name: name,
                        value: (remaining / required * 100).toFixed(1),
                        message: `نسبة المديونية: ${(remaining / required * 100).toFixed(1)}%`,
                        priority: 'medium'
                    });
                }
            }

            analysis.collectionRate = analysis.totalRevenue > 0 ?
                Math.round((analysis.totalPaid / analysis.totalRevenue) * 100) : 0;
            analysis.avgConsumption = analysis.activeSubscribers > 0 ?
                Math.round(analysis.totalConsumption / analysis.activeSubscribers) : 0;
            analysis.riskPercentage = analysis.totalSubscribers > 0 ?
                Math.round((analysis.highRiskCount / analysis.totalSubscribers) * 100) : 0;

            const randomFactor = 0.1 + Math.random() * 0.15;
            analysis.predictions.push({
                type: 'next_month_revenue',
                value: Math.round(analysis.totalRevenue * (1 + (Math.random() * 0.2 - 0.1))),
                confidence: Math.round(70 + Math.random() * 20),
                message: 'الإيرادات المتوقعة للشهر القادم'
            });

            analysis.predictions.push({
                type: 'debt_growth',
                value: Math.round(analysis.totalDebt * randomFactor),
                confidence: Math.round(65 + Math.random() * 25),
                message: 'نمو المديونيات المتوقع'
            });

            analysis.predictions.push({
                type: 'collection_improvement',
                value: Math.round(analysis.collectionRate + (Math.random() * 10 - 5)),
                confidence: Math.round(60 + Math.random() * 25),
                message: 'نسبة التحصيل المتوقعة بعد التحسين'
            });

            return analysis;
        }

        }

        // ============================================================
        //  مكونات React السينمائية
        // ============================================================

        // ---- الجزيئات ----
        const Particles = () => {
            useEffect(() => {
                const container = document.getElementById('particles-container');
                if (!container) return;
                for (let i = 0; i < 8; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 3 + Math.random() * 8;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 18 + 's';
                    p.style.animationDuration = 12 + Math.random() * 15 + 's';
                    p.style.opacity = 0.2 + Math.random() * 0.3;
                    container.appendChild(p);
                }
            }, []);
            return null;
        };

        // ---- الساعة ----
        const Clock = ({ onUpdate }) => {
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const h = String(now.getHours()).padStart(2, '0');
                    const m = String(now.getMinutes()).padStart(2, '0');
                    const s = String(now.getSeconds()).padStart(2, '0');
                    const time = h + ':' + m + ':' + s;
                    const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                    const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                        'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
                    ];
                    const date = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
                    const day = days[now.getDay()];
                    if (onUpdate) onUpdate({ time, date, day });
                }, 1000);
                return () => clearInterval(interval);
            }, [onUpdate]);
            return null;
        };

        // ---- شاشة الدخول السينمائية ----
        const LoginScreen = ({ onLogin, onAttendance, time, date, day, message, msgType, onMessageClear }) => {
            const [password, setPassword] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === ATTENDANCE_CODE) {
                    onAttendance();
                    setPassword('');
                    if (onMessageClear) onMessageClear();
                    return;
                }
                const user = USERS[password];
                if (user) {
                    onLogin(user);
                    setPassword('');
                    if (onMessageClear) onMessageClear();
                } else {
                    onMessageClear && onMessageClear('❌ كود الدخول غير صحيح', 'error');
                    setPassword('');
                    if (inputRef.current) {
                        inputRef.current.style.animation = 'shake 0.4s';
                        setTimeout(() => { if (inputRef.current) inputRef.current.style.animation = ''; }, 500);
                    }
                }
            };

            const msgClass = msgType === 'error' ? 'error-msg' : msgType === 'success' ? 'success-msg' : 'info-msg';

            return (
                <div className="login-wrapper">
                    <div className="login-card">
                        <div className="card-inner">
                    <div className="status-bar-login">
</div>

<div className="login-title">مشروع مياه السوفعي</div>
<div className="login-sub">نظام الرقابة والتحكم المركزي 2026</div>

<div className="login-time-date">

    <div className="date-display">

</div>

                        </div>
                    </div>
                </div>

        };

        // ---- مؤشر المزامنة السينمائي ----
        const SyncIndicator = ({ visible, message, type }) => {

                'warning' ? 'warning' : '');

            return (

                    <span>{icon}</span>

                </div>
            );
        };

        // ---- نتائج البحث السينمائية ----

                                            <div className="name">

                                            </div>

                        collectionRate: analysis.collectionRate,
                        collectionTrend: analysis.collectionRate > 80 ? 'up' : analysis.collectionRate > 60 ? 'stable' :
                            'down',
                        collectionChange: randomChange(),

                        consumptionTrend: analysis.avgConsumption > 50 ? 'up' : analysis.avgConsumption > 30 ? 'stable' :
                            'down',

                    });

                    const recs = generateAIRecommendations(analysis);

        // ---- مكون الشاشة الكاملة للرسم البياني ----
        const ChartFullscreen = ({ chartId, village, month, data, chartType, onClose }) => {

            const markAsSynced = useCallback((village, month, rowIndex, cellIndex) => {
    // ❌ العمود 12 لا يتم تعليمه كمزامن لأنه ليس في القائمة أصلاً
    if (cellIndex === 12) return;

    const key = `${village}_${month}`;
    setPendingChanges(prev => {
        const newChanges = { ...prev };
        if (newChanges[key]) {
            const idx = newChanges[key].findIndex(
                c => c.rowIndex === rowIndex && c.cellIndex === cellIndex
            );
            if (idx > -1) {
                newChanges[key][idx].synced = true;
            }
        }
        localStorage.setItem(PENDING_KEY, JSON.stringify(newChanges));

        // ===== حساب العدد: استبعاد العمود 12 =====
        let count = 0;
        for (const k in newChanges) {
            const changes = newChanges[k] || [];
            const unsynced = changes.filter(c => !c.synced && c.cellIndex !== 12);
            count += unsynced.length;
        }
        setPendingCount(count);
        return newChanges;
    });
}, []);

            const markAsPending = useCallback((village, month, rowIndex, cellIndex, value, meterNumber) => {
    // ❌ لا نحفظ العمود 12 (المتبقي) أبداً، لأنه من السيرفر
    if (cellIndex === 12) {
        console.log('⏭️ تجاهل حفظ المتبقي (يُحسب من السيرفر)');
        return;
    }

    const key = `${village}_${month}`;
    
    setPendingChanges(prev => {
        const newChanges = { ...prev };
        if (!newChanges[key]) newChanges[key] = [];

        const existing = newChanges[key].findIndex(
            c => c.rowIndex === rowIndex && c.cellIndex === cellIndex
        );

        if (existing > -1) {
            newChanges[key][existing] = {
                ...newChanges[key][existing],
                value,
                timestamp: Date.now(),
                synced: false,
                retryCount: (newChanges[key][existing].retryCount || 0) + 1
            };
        } else {
            newChanges[key].push({
                rowIndex,
                cellIndex,
                value,
                meterNumber,
                timestamp: Date.now(),
                synced: false,
                retryCount: 0
            });
        }

        localStorage.setItem(PENDING_KEY, JSON.stringify(newChanges));

        // ===== حساب العدد: استبعاد العمود 12 =====
        let count = 0;
        for (const k in newChanges) {
            const changes = newChanges[k] || [];
            // ❌ لا نحسب العمود 12 (المتبقي من السيرفر)
            const unsynced = changes.filter(c => !c.synced && c.cellIndex !== 12);
            count += unsynced.length;
        }
        setPendingCount(count);
        
        return newChanges;
    });
}, []);

            const syncImmediately = useCallback(async (village, month, rowIndex, cellIndex, value, meterNumber, retryCount = 0) => {
    const MAX_RETRIES = 5;
    const RETRY_DELAY = 3000;

    // ❌ العمود 12 لا يتم مزامنته من التطبيق
    if (cellIndex === 12) {
        console.log('⏭️ تجاهل مزامنة المتبقي (يُحسب من السيرفر)');
        return true;
    }

    if (!isMountedRef.current) return false;

    if (!navigator.onLine) {
        console.log('📶 غير متصل، حفظ محلياً:', { village, month, rowIndex, cellIndex, value });
        markAsPending(village, month, rowIndex, cellIndex, value, meterNumber);
        showSync('💾 تم الحفظ محلياً (غير متصل)', 'warning', 2000);
        return false;
    }

    const cellKey = `${village}_${month}_${rowIndex}_${cellIndex}`;
    setSyncingCells(prev => ({ ...prev, [cellKey]: true }));

    try {
        const apiUrl = villageAPIs[village];
        if (!apiUrl) {
            throw new Error('لا يوجد رابط للقرية: ' + village);
        }

        const formData = new FormData();
        formData.append('sheet', month);
        formData.append('row', rowIndex + 1);
        formData.append('col', String.fromCharCode(65 + cellIndex));
        formData.append('value', value);
        formData.append('meterNumber', meterNumber || '');
        formData.append('village', village);
        formData.append('action', 'update');

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        console.log(`🔄 جاري مزامنة (${village}, ${month}, صف ${rowIndex}, عمود ${cellIndex}): ${value}`);

        const response = await fetch(apiUrl, {
            method: 'POST',
            body: formData,
            signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (response.ok) {
            const result = await response.json();
            console.log('✅ تمت المزامنة بنجاح:', result);
            
            markAsSynced(village, month, rowIndex, cellIndex);
            
            // ✅ إذا كان التعديل في عمود المسلم، نطلب من السيرفر تحديث المتبقي
            if (cellIndex === 11) {
                console.log('🔄 تم تحديث المسلم، سيتم تحديث المتبقي من السيرفر تلقائياً عند تحميل البيانات');
            }
            
            showSync(`✅ تمت المزامنة (العمود ${cellIndex + 1})`, 'success', 1500);
            return true;
        } else {
            throw new Error('فشل المزامنة: HTTP ' + response.status);
        }
    } catch (error) {
        console.error('❌ خطأ في المزامنة:', error);

        if (retryCount < MAX_RETRIES) {
            showSync(`🔄 إعادة محاولة المزامنة (${retryCount + 1}/${MAX_RETRIES})...`, 'warning', 2000);
            await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
            return syncImmediately(village, month, rowIndex, cellIndex, value, meterNumber, retryCount + 1);
        } else {
            console.warn('💾 فشلت كل المحاولات، حفظ محلياً');
            markAsPending(village, month, rowIndex, cellIndex, value, meterNumber);
            showSync('💾 تم الحفظ محلياً، سيتم المزامنة عند عودة النت', 'warning', 3000);
            return false;
        }
    } finally {
        setSyncingCells(prev => {
            const newState = { ...prev };
            delete newState[cellKey];
            return newState;
        });
    }
}, [showSync, markAsPending, markAsSynced, villageAPIs, setSyncingCells]);

            const syncAllPendingChanges = useCallback(async () => {
    if (syncInProgress || !isMountedRef.current) {
        console.log('⏳ المزامنة قيد التنفيذ بالفعل');
        return;
    }

    if (!navigator.onLine) {
        showSync('?? لا يوجد اتصال بالإنترنت، سيتم المزامنة عند عودة النت', 'warning', 2000);
        return;
    }

    // ===== حساب التغييرات (استبعاد العمود 12) =====
    let totalPending = 0;
    const unsyncedList = [];
    
    for (const [key, changes] of Object.entries(pendingChanges)) {
        const [village, month] = key.split('_');
        // ❌ استبعاد العمود 12
        const unsynced = changes.filter(c => !c.synced && c.cellIndex !== 12);
        
        if (unsynced.length > 0) {
            totalPending += unsynced.length;
            unsyncedList.push({ village, month, changes: unsynced });
        }
    }

    if (totalPending === 0) {
        showSync('✅ جميع التغييرات مزامنة', 'success', 1500);
        loadPendingChanges();
        return;
    }

    setSyncInProgress(true);
    showSync(`🔄 جاري مزامنة ${totalPending} تغيير...`, 'info', 5000);

    let synced = 0;
    let failed = 0;

    for (const { village, month, changes } of unsyncedList) {
        for (const change of changes) {
            // ✅ نتجاوز window._paidSaving
            const originalPaidSaving = window._paidSaving;
            window._paidSaving = false;

            const success = await syncImmediately(
                village,
                month,
                change.rowIndex,
                change.cellIndex,
                change.value,
                change.meterNumber
            );

            window._paidSaving = originalPaidSaving;

            if (success) {
                synced++;
            } else {
                failed++;
            }

            await new Promise(resolve => setTimeout(resolve, 300));
        }
    }

    // ===== تحديث البيانات من السيرفر (ليظهر المتبقي الجديد) =====
    await loadData(true);

    const remaining = loadPendingChanges();

    if (failed === 0) {
        showSync(`✅ تمت مزامنة ${synced} تغيير بنجاح`, 'success', 3000);
    } else {
        showSync(`⚠️ تمت مزامنة ${synced} تغيير، فشل ${failed}`, 'warning', 4000);
    }

    setSyncInProgress(false);
    
    if (remaining > 0 && navigator.onLine) {
        console.log(`⏳ ${remaining} تغيير متبقي، إعادة المحاولة بعد 30 ثانية`);
        setTimeout(() => {
            syncAllPendingChanges();
        }, 30000);
    }
}, [pendingChanges, syncImmediately, loadData, loadPendingChanges, showSync, syncInProgress]);

            const fetchData = useCallback(async (village, month, forceRefresh = false) => {
    const cacheKey = `${village}_${month}`;
    const apiUrl = villageAPIs[village];

    if (!apiUrl) {
        showSync('❌ لا يوجد رابط لهذه القرية', 'error', 3000);
        return null;
    }

    const isOnline = navigator.onLine;

    // ============================================================
    //  🔥 الحالة 1: يوجد اتصال بالإنترنت
    //  → نجلب البيانات من السيرفر فقط
    //  → ❌ ممنوع استخدام الكاش أو النسخة الاحتياطية
    // ============================================================
    if (isOnline) {
        try {
            const url = `${apiUrl}?sheet=${encodeURIComponent(month)}&t=${Date.now()}`;
            const response = await fetch(url);
            
            if (!response.ok) throw new Error('فشل الاتصال: ' + response.status);
            
            const result = await response.json();
            
            if (!result || !Array.isArray(result) || result.length === 0) {
                throw new Error('لا توجد بيانات');
            }
            
            // ✅ حفظ في الكاش للاستخدام عند انقطاع النت فقط
            saveToCache(cacheKey, result);
            saveBackup(village, month, result);
            setIsCached(false);
            
            return result;
            
        } catch (error) {
            console.error('❌ خطأ في جلب البيانات:', error);
            
            // ❌❌❌ ممنوع استخدام الكاش أو النسخة الاحتياطية عند وجود نت ❌❌❌
            showSync('❌ فشل تحميل البيانات من السيرفر', 'error', 4000);
            return null;
        }
    }

    // ============================================================
    //  🔥 الحالة 2: لا يوجد اتصال بالإنترنت (Offline)
    //  → نستخدم الكاش أو النسخة الاحتياطية فقط
    // ============================================================
    if (!isOnline) {
        // محاولة جلب من الكاش
        const cached = getFromCache(cacheKey);
        if (cached) {
            setIsCached(true);
            showSync('📦 بيانات مخزنة (غير متصل بالإنترنت)', 'info', 3000);

if (data[0] && Array.isArray(data[0]) && data[0].length === 1) {

        // ✅ التحقق من أن هذا الصف ليس اسم قرية مكرر

        }

        let rowClass = '';
        const isTotalRow = (index === data.length - 1);
        if (isTotalRow) rowClass = 'total-row';
        
        let isDebtRow = false;
        if (Array.isArray(row) && row.length > 12) {

        html += `<tr class="${rowClass}" data-row="${index}">`;
        
        if (Array.isArray(row)) {
            row.forEach((cell, cellIndex) => {

                const isSynced = pending.find(
                    c => c.rowIndex === index && c.cellIndex === cellIndex && c.synced
                );
                const displayValue = pendingChange ? pendingChange.value : (cell || '');
                const isEditable = canEdit(index, cellIndex);
                const hasUnsaved = !!pendingChange && !pendingChange.synced;

                let extraClass = '';
                if (isEditable) extraClass += ' editable';
                if (hasUnsaved) extraClass += ' unsaved-change';
                if (isSynced && !hasUnsaved) extraClass += ' synced-success';

                html += `<td 
                    contenteditable="${isEditable ? 'true' : 'false'}"
                    class="${extraClass}"
                    data-row="${index}"
                    data-col="${cellIndex}"
                    data-meter="${row[0] || ''}"
                    data-original="${cell || ''}"
                >${displayValue}</td>`;

        } else {
            for (let i = 0; i < 14; i++) {
                const pendingChange = pending.find(
                    c => c.rowIndex === index && c.cellIndex === i && !c.synced

                const isSynced = pending.find(
                    c => c.rowIndex === index && c.cellIndex === i && c.synced
                );
                const displayValue = pendingChange ? pendingChange.value : (row[i] || '');
                const isEditable = canEdit(index, i);
                const hasUnsaved = !!pendingChange && !pendingChange.synced;

                let extraClass = '';
                if (isEditable) extraClass += ' editable';
                if (hasUnsaved) extraClass += ' unsaved-change';
                if (isSynced && !hasUnsaved) extraClass += ' synced-success';

                                const alreadyPending = existingPending.some(c => 
                                    c.rowIndex === rowIndex && c.cellIndex === cellIndex && !c.synced

                                if (alreadyPending) {
                                    console.log('⏳ تم الحفظ مسبقاً، تجاهل التكرار');
                                    return;
                                }
                                
                                // ===== منع التكرار باستخدام timer =====
                                if (window._paidSaving) {
                                    console.log('⏳ جاري الحفظ بالفعل...');
                                    return;
                                }
                                window._paidSaving = true;
                                
                                // ✅ حفظ القيمة محلياً أولاً
                                markAsPending(village, month, rowIndex, cellIndex, newValue, meterNumber);
                                
                                // ✅ محاولة المزامنة الفورية
                                if (navigator.onLine) {
                                    syncImmediately(village, month, rowIndex, cellIndex, newValue, meterNumber);
                                }
                                
                                // ✅ حساب المتبقي للرسالة
                                const totalRequired = parseNumber(data[rowIndex][9]) || 0;
                                const paidAmount = parseNumber(newValue) || 0;
                                const remainingReal = totalRequired - paidAmount;
                                const remainingForMessage = remainingReal - 200;
                                
                                showSync('💰 جاري حفظ المبلغ وإرسال الرسالة...', 'info', 2000);
                                
                                // ========== إرسال الرسالة ==========
                                setTimeout(async () => {
                                    try {
                                        const name = data[rowIndex][1] || 'المشترك';
                                        
                                        const dateValue = data[rowIndex][14];
                                        const finalDate = (dateValue && dateValue.toString().trim() !== '') 
                                            ? dateValue 
                                            : new Date().toLocaleDateString('ar-EG');
                                        
                                        let phone = (data[rowIndex][0] || '').toString().trim().replace(/\s+/g, '');
                                        
                                        if (phone.length === 9 && (phone.startsWith('77') || phone.startsWith('73') || phone.startsWith('71') || phone.startsWith('70'))) {
                                            phone = `+967${phone}`;
                                        }
                                        
                                        const message = `عزيزي ${name} لقد قمت بدفع مبلغ ${paidAmount} بتاريخ ${finalDate} والمتبقي عليك ${remainingForMessage}\nأمين الصندوق\nسليمان الفرزعي`;
                                        
                                        if (phone && (phone.startsWith('+967') || phone.length >= 9)) {
                                            window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
                                            showSync(`✓ تم إرسال رسالة للمشترك ${name}`, 'success', 4000);
                                        } else if (phone && phone.length > 0) {
                                            await navigator.clipboard.writeText(message);
                                            showSync(`⚠ رقم الجوال غير صحيح، تم نسخ الرسالة للحافظة`, 'warning', 4000);
                                        } else {
                                            await navigator.clipboard.writeText(message);
                                            showSync(`⚠ لا يوجد رقم جوال للمشترك ${name}، تم نسخ الرسالة للحافظة`, 'warning', 4000);
                                        }
                                        
                                    } catch (err) {
                                        console.error('خطأ في إرسال الرسالة:', err);
                                        try {
                                            const name = data[rowIndex][1] || 'المشترك';
                                            const message = `عزيزي ${name} لقد قمت بدفع مبلغ ${paidAmount} بتاريخ ${finalDate} والمتبقي عليك ${remainingForMessage}\nأمين الصندوق\nسليمان الفرزعي`;
                                            await navigator.clipboard.writeText(message);
                                            showSync(`⚠ حدث خطأ، لكن تم نسخ الرسالة للحافظة`, 'warning', 4000);
                                        } catch(e) {
                                            showSync(`❌ فشل إرسال الرسالة ونسخها`, 'error', 4000);
                                        }
                                    }
                                }, 300);
                                
                                setTimeout(() => {
                                    window._paidSaving = false;
                                }, 3000);
                                
                                return;
                            }
                            // ===== نهاية معالجة عمود المسلم =====

                            cell.dataset.original = newValue;
                            setData([...data]);
                            loadPendingChanges();
                        }
                    };
                    
                    cell.removeEventListener('blur', onBlur);
                    cell.removeEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            cell.blur();
                        }
                    });

                    cell.addEventListener('blur', onBlur);
                    cell.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            cell.blur();
                        }
                    });

                    cell.focus();
                }
            }}
        />
    );

    return `فاتورة شهر ${monthNum}: سابقة: ${subscriber.previous}, حالية: ${subscriber.current}, الفارق: ${diff}, المجموع: ${subscriber.total}, المسلم: ${subscriber.paid}, المتبقي: ${subscriber.remaining}${warning}`;

    // ✅ إرسال فوري جداً - بدون أي تحقق إضافي (لأن الكل لديهم أرقام)

            Math.round((stats[v].paid / stats[v].total) * 100) : 0;
        stats[v].avgConsumption = stats[v].consumptionCount > 0 ? 
            Math.round(stats[v].consumptionTotal / stats[v].consumptionCount) : 0;
    }
    
    // بيانات القرى الأخرى
    Object.entries(allVillagesData).forEach(([v, villageData]) => {
        if (v === village) return;
        
        if (villageData && Array.isArray(villageData) && villageData.length > 0) {
            for (let i = 2; i < villageData.length - 1; i++) {
                const row = villageData[i];
                if (!row || !row[1] || row[1] === 'الاسم') continue;
                
                const total = parseFloat(row[9] || 0);
                const paid = parseFloat(row[11] || 0);
                const remaining = parseFloat(row[12] || 0);
                const consumption = parseFloat(row[3] || 0) - parseFloat(row[2] || 0);
                
                stats[v].subscribers++;
                stats[v].total += total;
                stats[v].paid += paid;
                stats[v].remaining += remaining;
                if (remaining >= 5000) stats[v].highDebtCount++;
                if (consumption > 0) {
                    stats[v].consumptionTotal += consumption;
                    stats[v].consumptionCount++;
                }
            }
            stats[v].collectionRate = stats[v].total > 0 ? 
                Math.round((stats[v].paid / stats[v].total) * 100) : 0;
            stats[v].avgConsumption = stats[v].consumptionCount > 0 ? 
                Math.round(stats[v].consumptionTotal / stats[v].consumptionCount) : 0;
        }
    });
    
    return Object.values(stats);
}, [data, village, allVillagesData]);

                                                            height: '40px',

                                                            e.currentTarget.style.boxShadow = hasValidPhone ? '0 6px 25px rgba(37,211,102,0.6)' : '0 6px 25px rgba(255,183,3,0.5)';

                                                    </button>

                                            </tr>

)}
                        {/* ===== زر إلغاء وضع التركيز ===== */}

        // ============================================================
        //  تقديم التطبيق

        const root = ReactDOM.createRoot(document.getElementById('root'));
